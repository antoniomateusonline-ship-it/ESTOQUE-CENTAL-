function savePedido(e){
  e.preventDefault();
  const d = cur();
  const isEtq = ws==='etiquetag';
  const clienteNome = document.getElementById('f_cliente').value.trim();
  let itens;
  if(isEtq){
    const itensValidos = formItens.filter(it=>it.tamanhoId && it.quantidade>0);
    if(!itensValidos.length){ showToast('Adicione ao menos um item válido.', 'bad'); return; }
    const empresaMatch = (d.empresas||[]).find(emp=>emp.nome.toLowerCase()===clienteNome.toLowerCase());
    itens = itensValidos.map(it=>{
      const tam = tamanhoObj(it.tamanhoId);
      const num = numeracaoObj(it.numeracaoId);
      const empresaFinal = it.empresaId ? empresaObj(it.empresaId) : empresaMatch;
      let nome = tam ? tam.nome : 'Produto';
      if(num) nome += ' - '+num.nome;
      if(empresaFinal) nome += ' ('+empresaFinal.nome+')';
      if(it.descricaoRef) nome += ' — '+it.descricaoRef;
      const produtoExistente = d.estoque.find(p=>p.tipo==='Tag' && p.tamanhoId===it.tamanhoId && p.numeracaoId===(it.numeracaoId||'') && p.empresaId===(empresaFinal?empresaFinal.id:''));
      return { produtoId: produtoExistente?produtoExistente.id:'', tamanhoId: it.tamanhoId, numeracaoId: it.numeracaoId, empresaId: empresaFinal?empresaFinal.id:'',
        referencia: it.referenciaCodigo||'', descricaoRef: it.descricaoRef||'', composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'', ribbonId: it.ribbonId||'',
        nome, unidade:'un', quantidade: it.quantidade, precoUnit: it.precoUnit, subtotal: it.quantidade*it.precoUnit };
    });
  } else {
    const itensValidos = formItens.filter(it=>it.produtoId && it.quantidade>0);
    if(!itensValidos.length){ showToast('Adicione ao menos um item válido.', 'bad'); return; }
    itens = itensValidos.map(it=>{
      const prod = d.estoque.find(p=>p.id===it.produtoId);
      let nome = tagFullLabel(prod);
      if(it.descricaoRef) nome += ' — '+it.descricaoRef;
      return { produtoId: it.produtoId, referencia: it.referenciaCodigo||'', descricaoRef: it.descricaoRef||'', composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'', nome, unidade: saleUnitLabel(prod), quantidade: it.quantidade, precoUnit: it.precoUnit, subtotal: it.quantidade*it.precoUnit, tamanhoId: prod.tamanhoId||'', empresaId: prod.empresaId||'' };
    });
  }
  const total = itens.reduce((s,i)=>s+i.subtotal,0);
  const pedido = { id: uid(), numero: nextCode('PD','pd'), cliente: clienteNome,
    data: document.getElementById('f_data').value, observacoes: document.getElementById('f_obs').value.trim(), itens, total, status:'Pendente',
    criadoPor: usuarioAtual?usuarioAtual.nome:'' };
  d.pedidos.push(pedido);
  closeModal(); saveWS(); renderAll();
  showToast('Pedido criado com sucesso.', 'good');
}
function cancelPedido(id){
  if(!confirm('Cancelar este pedido?')) return;
  const p = cur().pedidos.find(x=>x.id===id);
  p.status = 'Cancelado';
  p.canceladoPor = usuarioAtual?usuarioAtual.nome:'';
  saveWS(); renderAll();
  showToast('Pedido cancelado.', 'good');
}
function convertPedido(id){
  const d = cur();
  const p = d.pedidos.find(x=>x.id===id);
  const naoProduzidos = [];
  p.itens.forEach(it=>{
    if(!it.produtoId && it.tamanhoId){
      const found = d.estoque.find(x=>x.tipo==='Tag' && x.tamanhoId===it.tamanhoId && x.numeracaoId===(it.numeracaoId||'') && x.empresaId===(it.empresaId||''));
      if(found) it.produtoId = found.id;
    }
    if(!it.produtoId) naoProduzidos.push(it.nome);
  });
  if(naoProduzidos.length){ showToast('Ainda não produzido: '+naoProduzidos.join(', ')+'. Produza este item antes de transformar em venda.', 'bad'); return; }
  const problemas = checkEstoqueParaItens(p.itens);
  if(problemas.length){ showToast(problemas.join(' · '), 'bad'); return; }
  baixarEstoqueItens(p.itens);
  const empresaMatch = (d.empresas||[]).find(emp=>emp.nome.toLowerCase()===p.cliente.toLowerCase());
  const venda = { id: uid(), numero: nextCode('VD','vd'), pedidoId: p.id, cliente: p.cliente, empresaId: empresaMatch?empresaMatch.id:'', data: todayISO().slice(0,10),
    itens: p.itens, formaPagamento: 'Não informado', desconto: 0, total: p.total, status: 'Concluída', statusPagamento: 'Pendente', entregue: false };
  d.vendas.push(venda);
  p.status = 'Concluído';
  saveWS(); renderAll();
  showToast('Pedido transferido para vendas.', 'good');
}

let financeiroEmpresaSelecionada = '';
function renderFinanceiro(){
  const d = cur();
  const vendasValidas = d.vendas.filter(v=>v.status!=='Cancelada');
  const valorInvestidoTotal = d.estoque.reduce((s,x)=>s+valorInvestidoItem(x),0);
  const valorProdutosProntos = d.estoque.filter(x=>x.tipo==='Tag' || (x.tipo==='Outro' && x.outroPronto)).reduce((s,x)=>s+valorInvestidoItem(x),0);
  const valorMateriaPrima = valorInvestidoTotal - valorProdutosProntos;
  const totalVendasGeral = vendasValidas.reduce((s,v)=>s+v.total,0);
  let custoVendido = 0;
  vendasValidas.forEach(v=> v.itens.forEach(it=>{
    const prod = d.estoque.find(p=>p.id===it.produtoId);
    if(prod) custoVendido += it.quantidade * custoUnitarioItem(prod);
  }));
  const lucroObtido = totalVendasGeral - custoVendido;
  let html = financeHtml(valorInvestidoTotal, valorMateriaPrima, valorProdutosProntos, totalVendasGeral, vendasValidas.length, lucroObtido);
  html += qrPagamentoConfigHtml();
  html += renderFechamentoCaixa();

  if(!vendasValidas.length){
    html += `<div class="panel"><div class="empty"><div class="glyph">◧</div><h4>Nenhuma venda registrada ainda</h4>
      <p>Assim que houver vendas, elas aparecem aqui organizadas por empresa.</p></div></div>`;
    return html;
  }
  const grupos = {};
  vendasValidas.forEach(v=>{
    const key = v.empresaId || '__semempresa__';
    if(!grupos[key]) grupos[key] = { empresaId: v.empresaId||'', nome: v.empresaId ? (empresaObj(v.empresaId)?empresaObj(v.empresaId).nome:v.cliente) : (v.cliente||'Cliente avulso'), vendas: [] };
    grupos[key].vendas.push(v);
  });
  const listaGrupos = Object.values(grupos).sort((a,b)=>{
    const totalA = a.vendas.reduce((s,v)=>s+v.total,0), totalB = b.vendas.reduce((s,v)=>s+v.total,0);
    return totalB-totalA;
  });
  const totalGeral = vendasValidas.reduce((s,v)=>s+v.total,0);
  const totalPago = vendasValidas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
  const totalPendente = totalGeral-totalPago;

  html += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-bar"></div><div class="label">Total vendido</div><div class="value">${fmtMoney(totalGeral)}</div><div class="note">${vendasValidas.length} venda(s)</div></div>
    <div class="kpi good"><div class="kpi-bar"></div><div class="label">Recebido</div><div class="value">${fmtMoney(totalPago)}</div><div class="note">Marcado como pago</div></div>
    <div class="kpi alert"><div class="kpi-bar"></div><div class="label">Pendente</div><div class="value">${fmtMoney(totalPendente)}</div><div class="note">Ainda não recebido</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-head"><h3>Vendas por empresa</h3></div>
    <table><thead><tr><th>Empresa / Cliente</th><th>Responsável Financeiro</th><th>Vendas</th><th>Total</th><th>Pago</th><th>Débito Pendente</th><th></th></tr></thead>
    <tbody>${listaGrupos.map(g=>{
      const total = g.vendas.reduce((s,v)=>s+v.total,0);
      const pago = g.vendas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
      const pendente = total-pago;
      const key = g.empresaId||'__semempresa__';
      const empObj = g.empresaId ? empresaObj(g.empresaId) : null;
      const resp = (empObj && empObj.responsavelFinanceiroId) ? (d.responsaveisFinanceiros||[]).find(r=>r.id===empObj.responsavelFinanceiroId) : null;
      return `<tr>
        <td>${esc(g.nome)}</td>
        <td>${resp?esc(resp.nome)+' <span class="mono" style="color:var(--ink-soft);">('+esc(resp.codigo)+')</span>':'—'}</td>
        <td class="mono">${g.vendas.length}</td>
        <td class="mono">${fmtMoney(total)}</td>
        <td class="mono">${fmtMoney(pago)}</td>
        <td class="mono">${pendente>0?badgeHtml('warn', fmtMoney(pendente)):fmtMoney(0)}</td>
        <td><div class="row-actions">
          <button class="btn btn-ghost btn-sm" onclick="verHistoricoEmpresa('${key}')">Ver histórico</button>
          ${pendente>0?`<button class="btn btn-ghost btn-sm" title="Imprimir comprovante de débito" onclick="printComprovanteDebito('${key}')">${iconPrint()} Comprovante de débito</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>
  </div>`;

  const debitosPorResp = {};
  listaGrupos.forEach(g=>{
    if(!g.empresaId) return;
    const empObj = empresaObj(g.empresaId);
    if(!empObj || !empObj.responsavelFinanceiroId) return;
    const total = g.vendas.reduce((s,v)=>s+v.total,0);
    const pago = g.vendas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
    const pendente = total-pago;
    if(pendente<=0) return;
    if(!debitosPorResp[empObj.responsavelFinanceiroId]) debitosPorResp[empObj.responsavelFinanceiroId] = [];
    debitosPorResp[empObj.responsavelFinanceiroId].push({ empresaId: g.empresaId, nome: g.nome, pendente });
  });
  const respsComDebito = Object.keys(debitosPorResp);
  if(respsComDebito.length){
    html += `<div class="panel"><div class="panel-head"><h3>Débitos por Responsável Financeiro</h3></div>
      <table><thead><tr><th>Responsável</th><th>Empresas com débito</th><th>Total em aberto</th><th></th></tr></thead>
      <tbody>${respsComDebito.map(respId=>{
        const resp = (d.responsaveisFinanceiros||[]).find(r=>r.id===respId);
        const lista = debitosPorResp[respId];
        const totalResp = lista.reduce((s,x)=>s+x.pendente,0);
        return `<tr>
          <td>${resp?esc(resp.nome)+' <span class="mono" style="color:var(--ink-soft);">('+esc(resp.codigo)+')</span>':'—'}</td>
          <td>${lista.map(x=>esc(x.nome)+' ('+fmtMoney(x.pendente)+')').join(', ')}</td>
          <td class="mono">${badgeHtml('warn', fmtMoney(totalResp))}</td>
          <td><div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="abrirSelecaoComprovanteResponsavel('${respId}')">${iconPrint()} Emitir comprovante</button>
            <button class="btn btn-ghost btn-sm" onclick="marcarTudoPagoResponsavel('${respId}')">${iconCheck()} Marcar tudo como pago</button>
          </div></td>
        </tr>`;
      }).join('')}</tbody></table>
    </div>`;
  }

  if(financeiroEmpresaSelecionada){
    const g = grupos[financeiroEmpresaSelecionada];
    if(g){
      html += `<div class="panel"><div class="panel-head"><div><h3>Histórico · ${esc(g.nome)}</h3><p>Vendas independentes desta empresa, mais recentes primeiro, com os materiais comprados em cada uma.</p></div>
        <button class="btn btn-ghost btn-sm" onclick="verHistoricoEmpresa('')">${iconX()} Fechar</button></div>
        ${[...g.vendas].sort((a,b)=>new Date(b.data)-new Date(a.data)).map(v=>{
          const saldo = saldoAbertoVenda(v);
          const parcial = saldo>0.005 && saldo<v.total-0.005;
          const badge = saldo<=0.005 ? badgeHtml('good','Pago') : parcial ? badgeHtml('warn','Parcial: '+fmtMoney(saldo)+' em aberto') : badgeHtml('warn','Pendente');
          return `
          <div style="border-top:1px solid var(--line-soft);padding:12px 4px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div><span class="code-tag">${esc(v.numero)}</span> <span class="l-sub">${fmtDate(v.data)}</span></div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="mono" style="font-weight:700;">${fmtMoney(v.total)}</span>
                ${badge}
                ${saldo>0.005?`<button class="btn btn-ghost btn-sm" onclick="abrirPagamentoDebitoModal(['${v.id}'],'${esc(g.nome)}')">Registrar pagamento</button>`:`<button class="btn btn-ghost btn-sm" onclick="togglePagamento('${v.id}')">Marcar pendente</button>`}
                <button class="icon-btn" title="Imprimir" onclick="printVenda('${v.id}')">${iconPrint()}</button>
              </div>
            </div>
            <table style="margin-top:8px;"><thead><tr><th>Material</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead>
              <tbody>${v.itens.map(it=>`<tr><td>${esc(it.nome)}</td><td class="mono">${fmtQty(it.quantidade)} ${esc(it.unidade||'')}</td><td class="mono">${fmtMoney(it.precoUnit)}</td><td class="mono">${fmtMoney(it.subtotal)}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;}).join('')}
      </div>`;
    }
  }
  return html;
}
function verHistoricoEmpresa(key){ financeiroEmpresaSelecionada = key; renderAll(); }
let fechamentoMesSelecionado = '';
function mesAtualStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function renderFechamentoCaixa(){
  const d = cur();
  const mesRef = fechamentoMesSelecionado || mesAtualStr();
  const [ano, mes] = mesRef.split('-').map(Number);
  const dentroDoMes = (dataStr)=>{ const dt = new Date(dataStr); return dt.getFullYear()===ano && (dt.getMonth()+1)===mes; };

  const vendasDoMes = d.vendas.filter(v=>v.status!=='Cancelada' && dentroDoMes(v.data));
  const comprasDoMes = (d.compras||[]).filter(c=>dentroDoMes(c.data));
  const faturamento = vendasDoMes.reduce((s,v)=>s+v.total,0);
  const reinvestido = comprasDoMes.reduce((s,c)=>s+c.valor,0);
  const resultado = faturamento - reinvestido;
  const collapsed = isColapsado('fechamento-caixa');

  const nomeMes = new Date(ano, mes-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const content = `
    <div class="field" style="max-width:220px;"><label>Mês de referência</label><input type="month" value="${mesRef}" onchange="mudarMesFechamento(this.value)"></div>
    <div class="kpi-grid" style="margin-top:10px;">
      <div class="kpi"><div class="kpi-bar"></div><div class="label">Faturamento do mês</div><div class="value">${fmtMoney(faturamento)}</div><div class="note">${vendasDoMes.length} venda(s)</div></div>
      <div class="kpi alert"><div class="kpi-bar"></div><div class="label">Reinvestido em matéria-prima</div><div class="value">${fmtMoney(reinvestido)}</div><div class="note">${comprasDoMes.length} compra(s)</div></div>
      <div class="kpi ${resultado>=0?'good':'alert'}"><div class="kpi-bar"></div><div class="label">Resultado do mês</div><div class="value">${fmtMoney(resultado)}</div><div class="note">Faturamento − reinvestimento</div></div>
    </div>

function printFechamentoCaixa(mesRef){
  const d = cur();
  const [ano, mes] = mesRef.split('-').map(Number);
  const dentroDoMes = (dataStr)=>{ const dt = new Date(dataStr); return dt.getFullYear()===ano && (dt.getMonth()+1)===mes; };
  const vendasDoMes = d.vendas.filter(v=>v.status!=='Cancelada' && dentroDoMes(v.data));
  const comprasDoMes = (d.compras||[]).filter(c=>dentroDoMes(c.data));
  const faturamento = vendasDoMes.reduce((s,v)=>s+v.total,0);
  const reinvestido = comprasDoMes.reduce((s,c)=>s+c.valor,0);
  const resultado = faturamento - reinvestido;
  const nomeMes = new Date(ano, mes-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const body = `
    <table><tbody>
      <tr><td style="font-weight:600;">Faturamento do mês</td><td>${fmtMoney(faturamento)} (${vendasDoMes.length} venda(s))</td></tr>
      <tr><td style="font-weight:600;">Reinvestido em matéria-prima</td><td>${fmtMoney(reinvestido)} (${comprasDoMes.length} compra(s))</td></tr>
      <tr><td style="font-weight:600;">Resultado do mês</td><td>${fmtMoney(resultado)}</td></tr>
    </tbody></table>
    <h3 style="font-family:'Space Grotesk';margin:16px 0 6px;">Vendas do mês</h3>
    <table><thead><tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Total</th></tr></thead>
    <tbody>${vendasDoMes.map(v=>`<tr><td>${esc(v.numero)}</td><td>${esc(v.cliente)}</td><td>${fmtDate(v.data)}</td><td>${fmtMoney(v.total)}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma venda</td></tr>'}</tbody></table>
    <h3 style="font-family:'Space Grotesk';margin:16px 0 6px;">Compras de matéria-prima do mês</h3>
    <table><thead><tr><th>Item</th><th>Data</th><th>Quantidade</th><th>Valor</th></tr></thead>
    <tbody>${comprasDoMes.map(c=>`<tr><td>${esc(c.itemNome)}</td><td>${fmtDate(c.data)}</td><td>${fmtQty(c.quantidade)} ${esc(c.unidade)}</td><td>${fmtMoney(c.valor)}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma compra</td></tr>'}</tbody></table>`;
  const html = `<div class="doc">${docHeadHtml('Fechamento de Caixa · '+WS_META[ws].label, nomeMes)}${body}
    <div class="doc-foot"><div>Emitido em ${fmtDateTime(todayISO())}</div>${signLineHtml()}</div></div>`;
  const text = buildReceiptText('Fechamento de Caixa', nomeMes,
    ['Faturamento: '+fmtMoney(faturamento), 'Reinvestido: '+fmtMoney(reinvestido), 'Resultado: '+fmtMoney(resultado)], [], []);
  printDocument(html, text);
}

function renderVendas(){
  const d = cur();
  if(!d.vendas.length){
    return `<div class="panel"><div class="empty"><div class="glyph">◧</div><h4>Nenhuma venda registrada</h4>
      <p>Registre uma venda avulsa ou transfira um pedido pronto para vendas.</p>
      <button class="btn btn-accent" onclick="openVendaForm()">${iconPlus()} Nova venda</button></div></div>`;
  }
  const gruposEmp = {};
  (d.empresas||[]).forEach(e=>{ gruposEmp[e.id] = { key:e.id, nome:e.nome, vendas:[] }; });
  const semEmpresa = { key:'__sem__', nome:'Sem '+termEmpresa().toLowerCase()+' definido(a)', vendas:[] };
  let vendasBase = d.vendas;
  if(buscaVendas.trim()){
    const q = buscaVendas.trim().toLowerCase();
    vendasBase = vendasBase.filter(v=> (v.cliente||'').toLowerCase().includes(q) || (v.numero||'').toLowerCase().includes(q));
  }
  vendasBase.forEach(v=>{
    if(v.empresaId && gruposEmp[v.empresaId]) gruposEmp[v.empresaId].vendas.push(v);
    else semEmpresa.vendas.push(v);
  });
  const grupos = Object.values(gruposEmp).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(semEmpresa.vendas.length) grupos.push(semEmpresa);

  return grupos.map(g=>{
    const concluidas = g.vendas.filter(v=>v.status==='Concluída').sort((a,b)=>new Date(b.data)-new Date(a.data));
    const canceladas = g.vendas.filter(v=>v.status==='Cancelada').sort((a,b)=>new Date(b.data)-new Date(a.data));
    const total = concluidas.reduce((s,v)=>s+v.total,0);
    const sub = g.vendas.length ? `${concluidas.length} concluída(s) · ${canceladas.length} cancelada(s) · Total: ${fmtMoney(total)}` : 'Nenhuma venda ainda';
    const content = `
      ${subToggleHeader('vendas-'+g.key+'-concl', 'Vendas Concluídas', concluidas.length)}
      ${isColapsado('vendas-'+g.key+'-concl') ? '' : vendaTableHtml(concluidas)}
      ${subToggleHeader('vendas-'+g.key+'-canc', 'Vendas Canceladas', canceladas.length)}
      ${isColapsado('vendas-'+g.key+'-canc') ? '' : vendaTableHtml(canceladas)}
    `;
    return collapsiblePanel('vendas-emp-'+g.key, esc(g.nome), sub, '', content);
  }).join('');
}

function saveVenda(e){
  e.preventDefault();
  const itensValidos = formItens.filter(it=>it.produtoId && it.quantidade>0);
  if(!itensValidos.length){ showToast('Adicione ao menos um item válido.', 'bad'); return; }
  const problemas = checkEstoqueParaItens(itensValidos);
  if(problemas.length){ showToast(problemas.join(' · '), 'bad'); return; }
  const d = cur();
  const itens = itensValidos.map(it=>{
    const prod = d.estoque.find(p=>p.id===it.produtoId);
    let nome = tagFullLabel(prod);
    if(it.descricaoRef) nome += ' — '+it.descricaoRef;
    return { produtoId: it.produtoId, referencia: it.referenciaCodigo||'', descricaoRef: it.descricaoRef||'', composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'', nome, unidade: saleUnitLabel(prod), quantidade: it.quantidade, precoUnit: it.precoUnit, subtotal: it.quantidade*it.precoUnit, tamanhoId: prod.tamanhoId||'', empresaId: prod.empresaId||'' };
  });
  const subtotal = itens.reduce((s,i)=>s+i.subtotal,0);
  const desconto = parseFloat(document.getElementById('f_desconto').value)||0;
  const clienteNome = document.getElementById('f_cliente').value.trim();
  const empresaMatch = (d.empresas||[]).find(emp=>emp.nome.toLowerCase()===clienteNome.toLowerCase());
  const statusPagEl = document.getElementById('f_statuspagamento');
  const totalVendaFinal = Math.max(0,subtotal-desconto);
  const statusPagInicial = statusPagEl?statusPagEl.value:'Pago';
  const venda = { id: uid(), numero: nextCode('VD','vd'), pedidoId: null, cliente: clienteNome, empresaId: empresaMatch?empresaMatch.id:'',
    data: document.getElementById('f_data').value, formaPagamento: document.getElementById('f_pagamento').value,
    desconto, itens, total: totalVendaFinal, status:'Concluída', statusPagamento: statusPagInicial,
    valorRecebido: statusPagInicial==='Pago' ? totalVendaFinal : 0, descontoPagamento: 0, entregue: true,
    criadoPor: usuarioAtual?usuarioAtual.nome:'' };
  baixarEstoqueItens(itensValidos);
  d.vendas.push(venda);
  closeModal(); saveWS(); renderAll();
  showToast('Venda registrada com sucesso.', 'good');
}
function cancelVenda(id){

async function shareToPrintApp(text){
  if(navigator.share){
    try{ await navigator.share({ text }); return true; }
    catch(e){ if(e && e.name==='AbortError') return true; }
  }
  try{ await navigator.clipboard.writeText(text); showToast('Este navegador não suporta compartilhamento direto — o texto do comprovante foi copiado, cole no app de impressão.', 'bad'); }
  catch(e){ showToast('Não foi possível compartilhar nem copiar automaticamente neste navegador.', 'bad'); }

function buildReceiptText(titulo, numero, metaLines, itens, totalLines, obsText){
  const em = cur().empresa; const cfg = cur().configImpressao || {};
  let t = em.nome+'\n';
  if(cfg.documento!==false && (em.documento||em.endereco)) t += [em.documento,em.endereco].filter(Boolean).join(' ')+'\n';
  t += '--------------------------------\n'+titulo.toUpperCase()+' '+numero+'\n--------------------------------\n';
  metaLines.forEach(l=>{ t += l+'\n'; });
  t += '--------------------------------\n';
  itens.forEach(i=>{
    t += i.nome+'\n';
    t += '  '+fmtQty(i.quantidade)+' '+(i.unidade||'')+' x '+fmtMoney(i.precoUnit)+' = '+fmtMoney(i.subtotal)+'\n';
  });
  t += '--------------------------------\n';
  totalLines.forEach(l=>{ t += l+'\n'; });
  if(obsText) t += '\nObs: '+obsText+'\n';
  if(cfg.assinatura!==false) t += '\n\n_____________________\nAssinatura\n';
  t += '\nEmitido em '+fmtDateTime(todayISO())+'\n\n\n';
  return t;
}

async function githubEnviarBackup(){
  const token = document.getElementById('f_ghtoken').value.trim();
  const repo = document.getElementById('f_ghrepo').value.trim();
  const path = document.getElementById('f_ghpath').value.trim() || 'backup.json';
  if(!token || !repo){ showToast('Preencha o token e o repositório.', 'bad'); return; }
  const backup = { versao: 1, dataExportacao: new Date().toISOString(), etiquetag: DATA.etiquetag, vimats: DATA.vimats };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(backup, null, 2))));
  const url = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}`;
  showToast('Enviando para o GitHub...', 'good');
  try{
    let sha = null;
    const getResp = await fetch(url, { headers: { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' } });
    if(getResp.status===200){ const getData = await getResp.json(); sha = getData.sha; }
    else if(getResp.status!==404){ showToast('Erro ao verificar o arquivo (status '+getResp.status+').', 'bad'); return; }
    const putResp = await fetch(url, {
      method:'PUT',
      headers: { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify({ message:'Backup Estoque Central - '+new Date().toLocaleString('pt-BR'), content, sha: sha||undefined })
    });
    if(putResp.ok){
      await setGithubConfig({token, repo, path, ultimoEnvio: new Date().toISOString(), ultimoPuxar: (await getGithubConfig()).ultimoPuxar||''});
      showToast('Backup enviado para o GitHub com sucesso!', 'good');
      openBackupModal();
    }
    else { const err = await putResp.json().catch(()=>({})); showToast('Erro ao enviar: '+(err.message||putResp.status), 'bad'); }
  } catch(e){ showToast('Não foi possível conectar ao GitHub. Verifique sua internet.', 'bad'); }
}
async function githubPuxarBackup(){
  const token = document.getElementById('f_ghtoken').value.trim();
  const repo = document.getElementById('f_ghrepo').value.trim();
  const path = document.getElementById('f_ghpath').value.trim() || 'backup.json';
  if(!token || !repo){ showToast('Preencha o token e o repositório.', 'bad'); return; }
  const url = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}`;
  showToast('Buscando backup no GitHub...', 'good');
  try{
    const resp = await fetch(url, { headers: { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' } });
    if(!resp.ok){ showToast('Não encontrei esse arquivo nesse repositório (status '+resp.status+').', 'bad'); return; }
    const respData = await resp.json();
    const jsonStr = decodeURIComponent(escape(atob(respData.content.replace(/\n/g,''))));
    const parsed = JSON.parse(jsonStr);
    if(!parsed.etiquetag || !parsed.vimats){ showToast('Arquivo encontrado, mas não é um backup válido.', 'bad'); return; }
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (Etiquetag e Vimats) pelos que estão no GitHub. Confirma?')) return;
    DATA.etiquetag = migrateIfNeeded('etiquetag', parsed.etiquetag);
    DATA.vimats = migrateIfNeeded('vimats', parsed.vimats);
    await appStorage.set(WS_META.etiquetag.storageKey, JSON.stringify(DATA.etiquetag), false);
    await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    await setGithubConfig({token, repo, path, ultimoPuxar: new Date().toISOString(), ultimoEnvio: (await getGithubConfig()).ultimoEnvio||''});
    closeModal();
    showToast('Dados atualizados a partir do GitHub!', 'good');
    renderAll();
  } catch(e){ showToast('Não foi possível conectar ao GitHub. Verifique sua internet.', 'bad'); }
}
function exportarBackup(){
  const backup = { versao: 1, dataExportacao: new Date().toISOString(), etiquetag: DATA.etiquetag, vimats: DATA.vimats };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-estoque-central-'+todayISO().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Backup baixado.', 'good');
}
function importarBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev){
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(err){ showToast('Não foi possível ler esse arquivo — verifique se é um backup válido.', 'bad'); return; }
    if(!parsed || !parsed.etiquetag || !parsed.vimats){ showToast('Arquivo de backup inválido ou incompleto.', 'bad'); return; }
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (Etiquetag e Vimats) pelos do backup. Essa ação não pode ser desfeita. Confirma?')) return;
    DATA.etiquetag = migrateIfNeeded('etiquetag', parsed.etiquetag);
    DATA.vimats = migrateIfNeeded('vimats', parsed.vimats);
    try{
      await appStorage.set(WS_META.etiquetag.storageKey, JSON.stringify(DATA.etiquetag), false);
      await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    } catch(err){}
    closeModal();
    showToast('Backup restaurado com sucesso!', 'good');
    renderAll();
  };
  reader.readAsText(file);
}

function abrirSelecaoComprovanteResponsavel(respId){

    return { empresaId: e.id, nome: e.nome, pendente };

  openModal(`

function prepararPagamentoComprovanteResponsavel(respId){

function abrirPagamentoDebitoModal(vendaIds, labelContexto){
  const d = cur();
  const vendas = d.vendas.filter(v=>vendaIds.includes(v.id));
  const totalAberto = vendas.reduce((s,v)=>s+saldoAbertoVenda(v),0);
  window._pagamentoDebitoVendaIds = vendaIds;
  openModal(`
    <div class="modal-head"><h3>Registrar pagamento${labelContexto?' · '+esc(labelContexto):''}</h3><button class="icon-btn" onclick="closeModal()">${iconX()}</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0;">Total em aberto: <strong>${fmtMoney(totalAberto)}</strong> (${vendas.length} venda(s))</p>
      <div class="field"><label>Este pagamento é</label>
        <div class="radio-row">
          <label><input type="radio" name="f_tipopagdebito" value="total" checked onchange="atualizarCampoPagamentoParcial()"> Valor total (${fmtMoney(totalAberto)})</label>
          <label><input type="radio" name="f_tipopagdebito" value="parcial" onchange="atualizarCampoPagamentoParcial()"> Pagamento parcial</label>
        </div>
      </div>
      <div class="field" id="campoValorParcial" style="display:none;"><label>Valor recebido agora (R$)</label><input type="number" min="0" step="0.01" id="f_valorrecebidodebito" placeholder="0,00">
        <p class="hint">O restante continua em aberto, como débito pendente.</p></div>
      <div class="field"><label>Houve desconto no pagamento? (opcional)</label><input type="number" min="0" step="0.01" id="f_descontodebito" placeholder="0,00">
        <p class="hint">Valor abatido do débito (ex.: desconto por pagamento à vista), somado ao valor recebido.</p></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-accent" onclick="confirmarPagamentoDebito()">${iconCheck()} Confirmar pagamento</button></div>
  `);
}
function atualizarCampoPagamentoParcial(){
  const tipo = document.querySelector('input[name="f_tipopagdebito"]:checked').value;
  const campo = document.getElementById('campoValorParcial');
  if(campo) campo.style.display = tipo==='parcial' ? 'block' : 'none';
}
function confirmarPagamentoDebito(){
  const vendaIds = window._pagamentoDebitoVendaIds||[];
  const d = cur();
  const vendasAlvo = d.vendas.filter(v=>vendaIds.includes(v.id)).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const totalAberto = vendasAlvo.reduce((s,v)=>s+saldoAbertoVenda(v),0);
  const tipo = document.querySelector('input[name="f_tipopagdebito"]:checked').value;
  const desconto = parseFloat(document.getElementById('f_descontodebito').value)||0;
  let valorRecebido = tipo==='total' ? Math.max(0, totalAberto-desconto) : (parseFloat(document.getElementById('f_valorrecebidodebito').value)||0);
  if(desconto<0 || valorRecebido<0){ showToast('Os valores não podem ser negativos.', 'bad'); return; }
  const totalAplicar = valorRecebido+desconto;
  if(totalAplicar<=0){ showToast('Informe o valor recebido e/ou o desconto.', 'bad'); return; }
  if(totalAplicar > totalAberto+0.01){ showToast('O valor informado (recebido + desconto) é maior que o débito em aberto.', 'bad'); return; }
  let restanteDesconto = desconto, restanteRecebido = valorRecebido;
  vendasAlvo.forEach(v=>{
    if(restanteDesconto<=0 && restanteRecebido<=0) return;
    const saldo = saldoAbertoVenda(v);
    if(saldo<=0.005) return;
    const descAplicado = Math.min(saldo, restanteDesconto);
    restanteDesconto -= descAplicado;
    const recAplicado = Math.min(saldo-descAplicado, restanteRecebido);
    restanteRecebido -= recAplicado;
    v.valorRecebido = (v.valorRecebido||0) + recAplicado;
    v.descontoPagamento = (v.descontoPagamento||0) + descAplicado;
    if(saldoAbertoVenda(v) <= 0.005) v.statusPagamento = 'Pago';
  });
  saveWS();
  closeModal();
  renderAll();
  const restante = totalAberto - totalAplicar;
  showToast(restante>0.005 ? 'Pagamento registrado. Restam '+fmtMoney(restante)+' em aberto.' : 'Débito quitado com sucesso.', 'good');
}

          <tbody>${v.itens.map(it=>`<tr><td>${esc(it.nome)}</td><td>${fmtQty(it.quantidade)} ${esc(it.unidade||'')}</td><td>${fmtMoney(it.precoUnit)}</td><td>${fmtMoney(it.subtotal)}</td></tr>`).join('')}</tbody></table>
        </div>`;}).join('')}`).join('')}
    <div class="doc-total"><div class="grand">Total geral do débito: ${fmtMoney(totalGeral)}</div></div>`;
  const html = `<div class="doc">${docHeadHtml('Comprovante de Débito · '+WS_META[ws].label, 'Emitido em '+fmtDate(todayISO()))}${body}
    <div class="doc-foot"><div>Emitido em ${fmtDateTime(todayISO())}</div>${signLineHtml()}</div></div>`;

function applyPrintPageStyle(formato){
  let sizeCSS;
  if(formato==='termica80') sizeCSS = '@page{ size: 80mm auto; margin: 3mm; }';
  else if(formato==='termica58') sizeCSS = '@page{ size: 58mm auto; margin: 2mm; }';
  else sizeCSS = '@page{ size: A4; margin: 15mm; }';
  let styleEl = document.getElementById('pageSizeStyle');
  if(!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'pageSizeStyle'; document.head.appendChild(styleEl); }
  styleEl.textContent = sizeCSS;
}
function printDocument(html, text){
  const cfg = cur().configImpressao || {formato:'a4'};
  if(cfg.metodoBluetooth==='rawbt' && text){ sendToRawBT(text); return; }
  if(cfg.metodoBluetooth==='compartilhar' && text){ shareToPrintApp(text); return; }
  applyPrintPageStyle(cfg.formato);
  const area = document.getElementById('printArea');
  area.className = cfg.formato==='termica80' ? 'thermal thermal80' : cfg.formato==='termica58' ? 'thermal thermal58' : '';
  area.innerHTML = cfg.formato && cfg.formato!=='a4' ? html.replace('class="doc"','class="doc thermal"') : html;
  const imgs = Array.from(area.querySelectorAll('img'));
  if(!imgs.length){ setTimeout(()=>window.print(), 50); return; }
  Promise.all(imgs.map(img=>{
    if(typeof img.decode === 'function'){
      return img.decode().catch(()=>new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; setTimeout(resolve,1500); }));
    }
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; setTimeout(resolve, 1500); });
  })).then(()=>{ setTimeout(()=>window.print(), 150); });
}

let usuarios = [];
let usuarioAtual = null;
async function loadUsuarios(){
  try{ const r = await appStorage.get('usuarios-config', false); const parsed = (r&&r.value)?JSON.parse(r.value):{usuarios:[]}; usuarios = parsed.usuarios||[]; }
  catch(e){ usuarios = []; }
}
async function saveUsuarios(){
  try{ await appStorage.set('usuarios-config', JSON.stringify({usuarios}), false); } catch(e){}
}
function abrirSeletorUsuario(obrigatorio){
  openModal(`
    <div class="modal-head"><h3>Quem está usando o app?</h3>${obrigatorio?'':'<button class="icon-btn" onclick="closeModal()">'+iconX()+'</button>'}</div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0;">Isso ajuda a saber quem fez cada pedido, venda ou produção. <strong>Não é uma senha de segurança</strong> — qualquer pessoa com o link ainda consegue abrir e usar o app normalmente.</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${usuarios.map(u=>`<button type="button" class="btn btn-ghost" style="justify-content:flex-start;" onclick="selecionarUsuario('${u.id}')">${esc(u.nome)}</button>`).join('') || '<p class="hint">Nenhuma pessoa cadastrada ainda.</p>'}
      </div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="abrirNovoUsuarioForm()">${iconPlus()} Adicionar pessoa</button>
    </div>
    ${obrigatorio?'':'<div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="continuarSemUsuario()">Continuar sem me identificar</button></div>'}
  `);
}
function continuarSemUsuario(){ closeModal(); }
function selecionarUsuario(id){
  usuarioAtual = usuarios.find(u=>u.id===id) || null;
  closeModal();
  renderAll();
  showToast('Olá, '+(usuarioAtual?usuarioAtual.nome:'')+'!', 'good');
}
function abrirNovoUsuarioForm(){
  openModal(`
    <div class="modal-head"><h3>Nova pessoa</h3><button class="icon-btn" onclick="abrirSeletorUsuario(false)">${iconX()}</button></div>
    <form onsubmit="salvarNovoUsuario(event)">
      <div class="modal-body">
        <div class="field"><label>Nome</label><input required id="f_usuarionome" placeholder="Ex.: Mateus"></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="abrirSeletorUsuario(false)">Voltar</button><button type="submit" class="btn btn-accent">${iconCheck()} Salvar</button></div>
    </form>`);
}
async function salvarNovoUsuario(e){
  e.preventDefault();
  const nome = document.getElementById('f_usuarionome').value.trim();
  if(!nome) return;
  const novo = {id:uid(), nome};
  usuarios.push(novo);
  await saveUsuarios();
  usuarioAtual = novo;
  closeModal();
  renderAll();
  showToast('Bem-vindo(a), '+nome+'!', 'good');
}
function excluirUsuario(id){
  if(!confirm('Excluir esta pessoa da lista?')) return;
  usuarios = usuarios.filter(u=>u.id!==id);
  if(usuarioAtual && usuarioAtual.id===id) usuarioAtual = null;
  saveUsuarios();
  renderAll();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
(async function init(){
  document.getElementById('content').innerHTML = `<div class="empty"><p>Carregando dados...</p></div>`;
  await loadAll();
  await loadUsuarios();
  document.body.className = 'ws-'+ws;
  renderAll();
  if(usuarios.length) abrirSeletorUsuario(false);
})();
</script>
</body>
