function convertPedido(id){
  const d = cur();
  const p = d.pedidos.find(x=>x.id===id);
  const naoProduzidos = [];
  p.itens.forEach(it=>{
    if(!it.produtoId && it.tamanhoId){
      const found = d.estoque.find(x=>x.tipo==='Tag' && x.tamanhoId===it.tamanhoId && x.numeracaoId===(it.numeracaoId||'') && x.empresaId===(it.empresaId||''));
      if(found) it.produtoId = found.id;
    }
    if(!it.produtoId) naoProduzidos.push(it.nome);
  });
  if(naoProduzidos.length){ showToast('Ainda não produzido: '+naoProduzidos.join(', ')+'. Produza este item antes de transformar em venda.', 'bad'); return; }
  const problemas = checkEstoqueParaItens(p.itens);
  if(problemas.length){ showToast(problemas.join(' · '), 'bad'); return; }
  baixarEstoqueItens(p.itens);
  const empresaMatch = (d.empresas||[]).find(emp=>emp.nome.toLowerCase()===p.cliente.toLowerCase());
  const venda = { id: uid(), dataRegistro: todayISO(), numero: nextNumeroDoc(), pedidoId: p.id, cliente: p.cliente, empresaId: empresaMatch?empresaMatch.id:'', data: todayISO().slice(0,10),
    itens: p.itens, formaPagamento: 'Não informado', desconto: 0, total: p.total, status: 'Concluída', statusPagamento: 'Pendente', entregue: false };
  d.vendas.push(venda);
  p.status = 'Concluído';
  saveWS(); renderAll();
  showToast('Pedido transferido para vendas.', 'good');
}

let financeiroEmpresaSelecionada = '';
function renderFinanceiro(){
  const d = cur();
  const vendasValidas = d.vendas.filter(v=>v.status!=='Cancelada');
  const r = calcResumoCaixa();
  let html = financeAbasHtml();
  if(financeiroAba==='precificacao' && ws==='etiquetag') return html + renderPrecificacaoMilheiro();
  if(financeiroAba==='fechamentos') return html + renderFechamentoCaixa();
  html += financeHtml(r.valorInvestidoTotal, r.valorMP, r.valorProntosCusto, r.faturamento, vendasValidas.length, r.lucroRealizado);
  html += renderCapitalLucroPanel(r);
  html += qrPagamentoConfigHtml();

  if(!vendasValidas.length){
    html += `<div class="panel"><div class="empty"><div class="glyph">◧</div><h4>Nenhuma venda registrada ainda</h4>
      <p>Assim que houver vendas, elas aparecem aqui organizadas por empresa.</p></div></div>`;
    return html;
  }
  const grupos = {};
  vendasValidas.forEach(v=>{
    const key = v.empresaId || '__semempresa__';
    if(!grupos[key]) grupos[key] = { empresaId: v.empresaId||'', nome: v.empresaId ? (empresaObj(v.empresaId)?empresaObj(v.empresaId).nome:v.cliente) : (v.cliente||'Cliente avulso'), vendas: [] };
    grupos[key].vendas.push(v);
  });
  const listaGrupos = Object.values(grupos).sort((a,b)=>{
    const totalA = a.vendas.reduce((s,v)=>s+v.total,0), totalB = b.vendas.reduce((s,v)=>s+v.total,0);
    return totalB-totalA;
  });
  const totalGeral = vendasValidas.reduce((s,v)=>s+v.total,0);
  const totalPago = vendasValidas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
  const totalPendente = totalGeral-totalPago;

  html += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-bar"></div><div class="label">Total vendido</div><div class="value">${fmtMoney(totalGeral)}</div><div class="note">${vendasValidas.length} venda(s)</div></div>
    <div class="kpi good"><div class="kpi-bar"></div><div class="label">Recebido</div><div class="value">${fmtMoney(totalPago)}</div><div class="note">Marcado como pago</div></div>
    <div class="kpi alert"><div class="kpi-bar"></div><div class="label">Pendente</div><div class="value">${fmtMoney(totalPendente)}</div><div class="note">Ainda não recebido</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-head"><h3>Vendas por empresa</h3></div>
    <table><thead><tr><th>Empresa / Cliente</th><th>Responsável Financeiro</th><th>Vendas</th><th>Total</th><th>Pago</th><th>Débito Pendente</th><th></th></tr></thead>
    <tbody>${listaGrupos.map(g=>{
      const total = g.vendas.reduce((s,v)=>s+v.total,0);
      const pago = g.vendas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
      const pendente = total-pago;
      const key = g.empresaId||'__semempresa__';
      const empObj = g.empresaId ? empresaObj(g.empresaId) : null;
      const resp = (empObj && empObj.responsavelFinanceiroId) ? (d.responsaveisFinanceiros||[]).find(r=>r.id===empObj.responsavelFinanceiroId) : null;
      return `<tr>
        <td>${esc(g.nome)}</td>
        <td>${resp?esc(resp.nome)+' <span class="mono" style="color:var(--ink-soft);">('+esc(resp.codigo)+')</span>':'—'}</td>
        <td class="mono">${g.vendas.length}</td>
        <td class="mono">${fmtMoney(total)}</td>
        <td class="mono">${fmtMoney(pago)}</td>

        <td><div class="row-actions">
          <button class="btn btn-ghost btn-sm" onclick="verHistoricoEmpresa('${key}')">Ver histórico</button>

          ${pendente>0?`<button class="btn btn-accent btn-sm" title="Gerar PDF do débito para enviar ao cliente" onclick="abrirPdfDebitoModal('${key}')">PDF do débito</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>
  </div>`;

  const debitosPorResp = {};
  listaGrupos.forEach(g=>{
    if(!g.empresaId) return;
    const empObj = empresaObj(g.empresaId);
    if(!empObj || !empObj.responsavelFinanceiroId) return;
    const total = g.vendas.reduce((s,v)=>s+v.total,0);
    const pago = g.vendas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
    const pendente = total-pago;
    if(pendente<=0) return;
    if(!debitosPorResp[empObj.responsavelFinanceiroId]) debitosPorResp[empObj.responsavelFinanceiroId] = [];
    debitosPorResp[empObj.responsavelFinanceiroId].push({ empresaId: g.empresaId, nome: g.nome, pendente });
  });
  const respsComDebito = Object.keys(debitosPorResp);
  if(respsComDebito.length){
    html += `<div class="panel"><div class="panel-head"><h3>Débitos por Responsável Financeiro</h3></div>
      <table><thead><tr><th>Responsável</th><th>Empresas com débito</th><th>Total em aberto</th><th></th></tr></thead>
      <tbody>${respsComDebito.map(respId=>{
        const resp = (d.responsaveisFinanceiros||[]).find(r=>r.id===respId);
        const lista = debitosPorResp[respId];
        const totalResp = lista.reduce((s,x)=>s+x.pendente,0);
        return `<tr>
          <td>${resp?esc(resp.nome)+' <span class="mono" style="color:var(--ink-soft);">('+esc(resp.codigo)+')</span>':'—'}</td>
          <td>${lista.map(x=>esc(x.nome)+' ('+fmtMoney(x.pendente)+')').join(', ')}</td>
          <td class="mono">${badgeHtml('warn', fmtMoney(totalResp))}</td>
          <td><div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="abrirSelecaoComprovanteResponsavel('${respId}')">${iconPrint()} Emitir comprovante</button>
            <button class="btn btn-ghost btn-sm" onclick="marcarTudoPagoResponsavel('${respId}')">${iconCheck()} Marcar tudo como pago</button>
          </div></td>
        </tr>`;
      }).join('')}</tbody></table>
    </div>`;
  }

  if(financeiroEmpresaSelecionada){
    const g = grupos[financeiroEmpresaSelecionada];
    if(g){
      html += `<div class="panel"><div class="panel-head"><div><h3>Histórico · ${esc(g.nome)}</h3><p>Vendas independentes desta empresa, mais recentes primeiro, com os materiais comprados em cada uma.</p></div>
        <button class="btn btn-ghost btn-sm" onclick="verHistoricoEmpresa('')">${iconX()} Fechar</button></div>
        ${[...g.vendas].sort((a,b)=>new Date(b.data)-new Date(a.data)).map(v=>{
          const saldo = saldoAbertoVenda(v);
          const parcial = saldo>0.005 && saldo<v.total-0.005;
          const badge = saldo<=0.005 ? badgeHtml('good','Pago') : parcial ? badgeHtml('warn','Parcial: '+fmtMoney(saldo)+' em aberto') : badgeHtml('warn','Pendente');
          return `
          <div style="border-top:1px solid var(--line-soft);padding:12px 4px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div><span class="code-tag">${esc(v.numero)}</span> <span class="l-sub">${fmtDate(v.data)}</span></div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="mono" style="font-weight:700;">${fmtMoney(v.total)}</span>
                ${badge}
                ${saldo>0.005?`<button class="btn btn-ghost btn-sm" onclick="abrirPagamentoDebitoModal(['${v.id}'],'${esc(g.nome)}')">Registrar pagamento</button>`:`<button class="btn btn-ghost btn-sm" onclick="togglePagamento('${v.id}')">Marcar pendente</button>`}

              <tbody>${v.itens.map(it=>`<tr><td>${esc(it.nome)}</td><td class="mono">${fmtQty(it.quantidade)} ${esc(it.unidade||'')}</td><td class="mono">${fmtMoney(it.precoUnit)}</td><td class="mono">${fmtMoney(it.subtotal)}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;}).join('')}
      </div>`;
    }
  }
  return html;
}

function itemEhPronto(x){ return ws==='etiquetag' ? (x.tipo==='Tag' || (x.tipo==='Outro' && x.outroPronto)) : true; }
function calcResumoCaixa(){
  const d = cur();
  const vendasValidas = d.vendas.filter(v=>v.status!=='Cancelada');
  const prontos = d.estoque.filter(itemEhPronto);
  const mps = d.estoque.filter(x=>!itemEhPronto(x));
  const valorMP = mps.reduce((s,x)=>s+valorInvestidoItem(x),0);
  const valorProntosCusto = prontos.reduce((s,x)=>s+valorInvestidoItem(x),0);
  const valorProntosVenda = prontos.reduce((s,x)=>s+itemValorEstoque(x),0);
  const faturamento = vendasValidas.reduce((s,v)=>s+v.total,0);
  let custoVendido = 0;
  vendasValidas.forEach(v=> v.itens.forEach(it=>{
    const prod = d.estoque.find(p=>p.id===it.produtoId);
    if(prod) custoVendido += it.quantidade * custoUnitarioItem(prod);
  }));
  const recebido = vendasValidas.reduce((s,v)=>s+(v.total-saldoAbertoVenda(v)),0);
  const lucroRealizado = faturamento - custoVendido;
  const capitalGiro = valorMP + valorProntosCusto;
  return { valorInvestidoTotal: valorMP+valorProntosCusto, valorMP, valorProntosCusto, valorProntosVenda, lucroPrevistoProntos: valorProntosVenda-valorProntosCusto,
    faturamento, custoVendido, lucroRealizado, recebido, aReceber: faturamento-recebido, capitalGiro, capitalTotal: capitalGiro+lucroRealizado };
}

function ultimoFechamento(){ const l=[...(cur().fechamentos||[])].sort((a,b)=>new Date(b.data)-new Date(a.data)); return l[0]||null; }
function dadosPeriodoFechamento(){
  const d = cur(); const ult = ultimoFechamento(); const desde = ult ? new Date(ult.data) : null;
  const dep = x => !desde || new Date(x) > desde;
  const vendas = d.vendas.filter(v=>v.status!=='Cancelada' && dep(v.dataRegistro||v.data));
  const compras = (d.compras||[]).filter(c=>dep(c.data));
  return { desde: ult ? ult.data : '', vendas: vendas.length, faturamento: vendas.reduce((s,v)=>s+v.total,0), compras: compras.length, valorCompras: compras.reduce((s,c)=>s+(c.valor||0),0) };
}

/* ---------- Precificação do milheiro ---------- */
function custoMedioRibbonPorMetro(tipo){
  const l = cur().estoque.filter(x=>x.tipo==='Ribbon' && x.tipoRibbon===tipo && x.preco>0);
  return l.length ? l.reduce((s,x)=>s+x.preco,0)/l.length : 0;
}
function custoTagMilheiro(t){
  const l = cur().estoque.filter(x=>x.tipo==='TagMP' && x.tamanhoId===t.id && x.custo>0);
  const upr = t.unidadesPorRolo||0;
  if(!l.length || upr<=0) return 0;
  const custoRolo = l.reduce((s,x)=>s+x.custo,0)/l.length;
  return custoRolo/upr*1000;
}
function precoAtualMilheiro(t, tipo){ return t.composicao ? ((t.precosPorRibbon||{})[tipo]||0) : (t.precoMilheiro||0); }
function linhasPrecificacao(){
  const out = [];
  cur().tamanhos.forEach(t=>{
    const tipos = t.composicao ? ['Cera','Têxtil'] : ['Cera'];
    tipos.forEach(tipo=>{
      const custoTag = custoTagMilheiro(t);
      const ribbonM = custoMedioRibbonPorMetro(tipo) * getConsumoMetros(t) * 1000;
      const custo = custoTag + ribbonM;
      const margem = ((t.margensMilheiro||{})[tipo]) ?? 30;
      out.push({ t, tipo, custoTag, ribbonM, custo, margem, atual: precoAtualMilheiro(t,tipo) });
    });
  });
  return out;
}
function sugeridoMilheiro(custo, margem){ return margem<100 ? custo/(1-margem/100) : 0; }
function renderPrecificacaoMilheiro(){
  const linhas = linhasPrecificacao();
  const rib = ['Cera','Têxtil','Misto'].map(t=>[t, custoMedioRibbonPorMetro(t)]).filter(x=>x[1]>0);
  if(!linhas.length) return `<div class="panel"><div class="empty" style="padding:24px;"><p>Cadastre modelos em Cadastros para precificar o milheiro.</p></div></div>`;
  return `<div class="panel"><div class="panel-head"><div><h3>Precificação do milheiro</h3><p>Custo = etiqueta em branco (por milheiro) + ribbon gasto (metros por milheiro × custo médio do metro). Defina a margem e aplique o preço — ele passa a valer nos pedidos, vendas e produção.</p></div></div>
    <div style="padding:14px 18px;">
      <p class="hint" style="margin-top:0;">Custo médio do ribbon por metro: ${rib.length ? rib.map(([t,v])=>esc(t)+' '+fmtMoney3(v)).join(' · ') : 'nenhum ribbon com preço cadastrado ainda'}.</p>
      <div style="overflow-x:auto;"><table><thead><tr><th>Modelo</th><th>Etiqueta/milheiro</th><th>Ribbon/milheiro</th><th>Custo total</th><th>Margem (%)</th><th>Preço sugerido</th><th>Preço de venda atual</th><th>Lucro/milheiro</th><th></th></tr></thead>
      <tbody>${linhas.map((l,i)=>`<tr>
        <td>${esc(l.t.nome)}${l.t.dimensao?' <span class="l-sub">'+esc(l.t.dimensao)+'</span>':''}${l.t.composicao?'<div class="l-sub">Ribbon '+esc(l.tipo)+'</div>':''}</td>
        <td class="mono">${fmtMoney(l.custoTag)}</td><td class="mono">${fmtMoney(l.ribbonM)}</td><td class="mono" id="prc_custo_${i}">${fmtMoney(l.custo)}</td>
        <td><input type="number" min="0" max="99" step="0.5" value="${l.margem}" style="width:80px;" oninput="atualizarMargemMilheiro(${i},this.value)"></td>
        <td class="mono" id="prc_sug_${i}">${fmtMoney(sugeridoMilheiro(l.custo,l.margem))}</td>
        <td><input type="number" min="0" step="0.01" value="${l.atual}" style="width:100px;" onchange="salvarPrecoMilheiro(${i},this.value)"></td>
        <td class="mono" style="color:${l.atual-l.custo>=0?'inherit':'#B23A3A'};">${fmtMoney(l.atual-l.custo)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="aplicarPrecoSugeridoMilheiro(${i})">Usar sugerido</button></td></tr>`).join('')}</tbody></table></div>
      ${linhas.some(l=>l.custo<=0)?`<p class="hint">Linhas com custo R$ 0,00 estão sem preço de ribbon, custo da tag em branco ou passo/consumo do modelo cadastrados.</p>`:''}
    </div></div>`;
}
function atualizarMargemMilheiro(i, valor){
  const l = linhasPrecificacao()[i]; if(!l) return;
  const m = parseFloat(valor); const margem = isNaN(m)?0:m;
  if(!l.t.margensMilheiro) l.t.margensMilheiro = {};
  l.t.margensMilheiro[l.tipo] = margem;
  const el = document.getElementById('prc_sug_'+i); if(el) el.textContent = fmtMoney(sugeridoMilheiro(l.custo, margem));
  saveWS();
}
function salvarPrecoMilheiro(i, valor){
  const l = linhasPrecificacao()[i]; if(!l) return;
  const v = parseFloat(valor)||0;
  if(l.t.composicao){ if(!l.t.precosPorRibbon) l.t.precosPorRibbon = {}; l.t.precosPorRibbon[l.tipo] = v; }
  else l.t.precoMilheiro = v;
  saveWS(); renderAll(); showToast('Preço do milheiro atualizado.', 'good');
}
function aplicarPrecoSugeridoMilheiro(i){
  const l = linhasPrecificacao()[i]; if(!l) return;
  const sug = sugeridoMilheiro(l.custo, l.margem);
  if(sug<=0){ showToast('Sem custo para calcular o preço sugerido.', 'bad'); return; }
  salvarPrecoMilheiro(i, sug.toFixed(2));
}

function togglePagamento(vendaId){
  const d = cur();
  const v = d.vendas.find(x=>x.id===vendaId);
  if(!v) return;
  if(v.statusPagamento==='Pendente'){ v.statusPagamento = 'Pago'; v.valorRecebido = v.total - (v.descontoPagamento||0); }
  else { v.statusPagamento = 'Pendente'; v.valorRecebido = 0; v.descontoPagamento = 0; }
  saveWS(); renderAll();
  showToast('Status de pagamento atualizado.', 'good');
}
function toggleEntregue(vendaId){
  const d = cur();
  const v = d.vendas.find(x=>x.id===vendaId);
  if(!v) return;
  v.entregue = v.entregue===false ? true : false;
  saveWS(); renderAll();
  showToast('Status de entrega atualizado.', 'good');
}

function numeroSeq(v){ const m = /(\d+)\s*$/.exec(v.numero||''); return m ? parseInt(m[1],10) : 0; }
function vendaTableHtml(lista, mostrarCliente){

  return `<table><thead><tr><th>Nº</th>${mostrarCliente?'<th>Cliente</th>':''}<th>Data</th><th>Itens</th><th>Total</th><th>Entregue</th><th></th></tr></thead>
    <tbody>${lista.map(v=>`
      <tr>
        <td><span class="code-tag">${esc(v.numero)}</span>${v.status==='Cancelada'?' '+badgeHtml('warn','Cancelada'):''}${(v.criadoPor||v.canceladoPor)?`<div class="l-sub">${v.canceladoPor?'Cancelado por '+esc(v.canceladoPor):(v.criadoPor?'Criado por '+esc(v.criadoPor):'')}</div>`:''}</td>${mostrarCliente?`<td>${esc(v.cliente)}</td>`:''}<td>${fmtDate(v.data)}</td><td>${v.itens.length}</td>
        <td class="mono">${fmtMoney(v.total)}</td>
        <td>${v.status==='Concluída'?`<button class="btn btn-sm ${v.entregue===false?'btn-ghost':'btn-accent'}" onclick="toggleEntregue('${v.id}')">${v.entregue===false?badgeHtml('warn','Não entregue'):badgeHtml('good','Entregue')}</button>`:'—'}</td>
        <td><div class="row-actions">
          ${v.status==='Concluída'?`<button class="btn btn-ghost btn-sm" title="Editar venda" onclick="openEditarVenda('${v.id}')">${iconEdit()} Editar</button>`:''}
          <button class="btn btn-accent btn-sm" title="Gerar PDF do comprovante para enviar ao cliente" onclick="gerarPdfVenda('${v.id}')">PDF</button>
          <button class="btn btn-ghost btn-sm" title="Imprimir comprovante" onclick="printVenda('${v.id}')">${iconPrint()}</button>
          ${v.status==='Concluída'?`<button class="icon-btn" title="Cancelar venda" onclick="cancelVenda('${v.id}')">${iconX()}</button>`:''}
          <button class="icon-btn" title="Excluir" onclick="deleteVenda('${v.id}')">${iconTrash()}</button>
        </div></td>
      </tr>`).join('')}

function renderVendas(){
  const d = cur();
  if(!d.vendas.length){
    return `<div class="panel"><div class="empty"><div class="glyph">◧</div><h4>Nenhuma venda registrada</h4>
      <p>Registre uma venda avulsa ou transfira um pedido pronto para vendas.</p>
      <button class="btn btn-accent" onclick="openVendaForm()">${iconPlus()} Nova venda</button></div></div>`;
  }
  const gruposEmp = {};
  (d.empresas||[]).forEach(e=>{ gruposEmp[e.id] = { key:e.id, nome:e.nome, vendas:[] }; });
  const semEmpresa = { key:'__sem__', nome:'Sem '+termEmpresa().toLowerCase()+' definido(a)', vendas:[] };
  let vendasBase = d.vendas;
  if(buscaVendas.trim()){
    const q = buscaVendas.trim().toLowerCase();
    vendasBase = vendasBase.filter(v=> (v.cliente||'').toLowerCase().includes(q) || (v.numero||'').toLowerCase().includes(q));
  }
  vendasBase.forEach(v=>{
    if(v.empresaId && gruposEmp[v.empresaId]) gruposEmp[v.empresaId].vendas.push(v);
    else semEmpresa.vendas.push(v);
  });
  const grupos = Object.values(gruposEmp).filter(g=>g.vendas.length).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(semEmpresa.vendas.length) grupos.push(semEmpresa);

  const porCliente = grupos.map(g=>{
    const concluidas = g.vendas.filter(v=>v.status==='Concluída').sort((a,b)=>new Date(b.data)-new Date(a.data));
    const canceladas = g.vendas.filter(v=>v.status==='Cancelada').sort((a,b)=>new Date(b.data)-new Date(a.data));
    const total = concluidas.reduce((s,v)=>s+v.total,0);
    const sub = `${concluidas.length} concluída(s) · ${canceladas.length} cancelada(s) · Total: ${fmtMoney(total)}`;
    const content = `
      ${subToggleHeader('vendas-'+g.key+'-concl', 'Vendas Concluídas', concluidas.length)}
      ${isColapsado('vendas-'+g.key+'-concl') ? '' : vendaTableHtml(concluidas, false)}
      ${canceladas.length ? subToggleHeader('vendas-'+g.key+'-canc', 'Vendas Canceladas', canceladas.length) : ''}
      ${canceladas.length && !isColapsado('vendas-'+g.key+'-canc') ? vendaTableHtml(canceladas, false) : ''}`;
    return `<div style="margin:0 0 4px;">${collapsiblePanel('vendas-emp-'+g.key, esc(g.nome), sub, '', content)}</div>`;
  }).join('');

  const sequencial = [...vendasBase].sort((a,b)=> numeroSeq(b)-numeroSeq(a) || new Date(b.data)-new Date(a.data));
  const totalSeq = sequencial.filter(v=>v.status==='Concluída').reduce((s,v)=>s+v.total,0);

  return collapsiblePanel('vendas-por-clientes', 'Vendas por Clientes', grupos.length+' pasta(s) de cliente — cada cliente com suas vendas registradas',
      '', porCliente || `<div class="empty" style="padding:16px;"><p>Nenhuma venda encontrada.</p></div>`)
    + collapsiblePanel('vendas-sequencial', 'Vendas Sequencial', sequencial.length+' venda(s) · mais recente primeiro · Total concluído: '+fmtMoney(totalSeq),
      '', vendaTableHtml(sequencial, true));
}

          <div class="field"><label>Desconto (R$)</label><input type="number" min="0" step="0.01" id="f_eddesconto" value="${v.desconto||0}" oninput="recalcEdicaoVenda()"></div>

function renderEdicaoVendaItens(){
  const el = document.getElementById('edVendaItens'); if(!el) return;
  el.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th>Item</th><th>Qtd</th><th>Preço un.</th><th>Subtotal</th><th></th></tr></thead><tbody>
    ${vendaEdicaoItens.map((it,idx)=>`<tr><td>${esc(it.nome)}</td>
      <td><input type="number" min="0" step="0.001" value="${it.quantidade}" style="width:90px;" oninput="atualizarEdicaoVendaItem(${idx},'quantidade',this.value)"></td>
      <td><input type="number" min="0" step="0.0001" value="${it.precoUnit}" style="width:100px;" oninput="atualizarEdicaoVendaItem(${idx},'precoUnit',this.value)"></td>
      <td class="mono" id="edsub_${idx}">${fmtMoney(it.quantidade*it.precoUnit)}</td>
      <td><button type="button" class="icon-btn" title="Remover item" onclick="removerEdicaoVendaItem(${idx})">${iconX()}</button></td></tr>`).join('')}
  </tbody></table></div>`;
  recalcEdicaoVenda();
}
function atualizarEdicaoVendaItem(idx, campo, valor){
  vendaEdicaoItens[idx][campo] = parseFloat(valor)||0;
  const sub = document.getElementById('edsub_'+idx);
  if(sub) sub.textContent = fmtMoney(vendaEdicaoItens[idx].quantidade*vendaEdicaoItens[idx].precoUnit);
  recalcEdicaoVenda();
}
function removerEdicaoVendaItem(idx){ vendaEdicaoItens.splice(idx,1); renderEdicaoVendaItens(); }
function recalcEdicaoVenda(){
  const sub = vendaEdicaoItens.reduce((s,i)=>s+i.quantidade*i.precoUnit,0);
  const desc = parseFloat((document.getElementById('f_eddesconto')||{}).value)||0;
  const el = document.getElementById('edVendaTotal'); if(el) el.textContent = fmtMoney(Math.max(0,sub-desc));
}
function salvarEdicaoVenda(e){
  e.preventDefault();
  const d = cur();
  const v = d.vendas.find(x=>x.id===editingId); if(!v) return;
  const novos = vendaEdicaoItens.filter(i=>i.produtoId && i.quantidade>0);
  if(!novos.length){ showToast('A venda precisa ter ao menos um item com quantidade.', 'bad'); return; }
  restaurarEstoqueItens(v.itens);
  const problemas = checkEstoqueParaItens(novos);
  if(problemas.length){ baixarEstoqueItens(v.itens); showToast(problemas.join(' · '), 'bad'); return; }
  baixarEstoqueItens(novos);
  v.itens = novos.map(i=>({...i, subtotal: i.quantidade*i.precoUnit}));
  const subtotal = v.itens.reduce((s,i)=>s+i.subtotal,0);
  v.desconto = parseFloat(document.getElementById('f_eddesconto').value)||0;
  v.total = Math.max(0, subtotal - v.desconto);
  v.cliente = document.getElementById('f_edcliente').value.trim();
  const emp = (d.empresas||[]).find(x=>x.nome.toLowerCase()===v.cliente.toLowerCase());
  v.empresaId = emp ? emp.id : '';
  v.data = document.getElementById('f_eddata').value;
  v.formaPagamento = document.getElementById('f_edpagamento').value;
  if(v.statusPagamento==='Pago') v.valorRecebido = Math.max(0, v.total - (v.descontoPagamento||0));
  else v.valorRecebido = Math.min(v.valorRecebido||0, v.total);
  v.editadoPor = usuarioAtual?usuarioAtual.nome:'';
  closeModal(); saveWS(); renderAll();
  showToast('Venda atualizada.', 'good');
}
async function gerarPdfVenda(id){
  const d = cur();
  const v = d.vendas.find(x=>x.id===id); if(!v) return;
  let jsPDF;
  try{ jsPDF = (await carregarJsPDF()).jsPDF; }
  catch(e){ showToast('Sem internet para gerar o PDF. Abrindo impressão: escolha "Salvar como PDF".', 'bad'); printVenda(id); return; }
  const L = t => String(t==null?'':t).replace(/[   ]/g,' ').replace(/[–—]/g,'-').replace(/[^\x00-\xFF]/g,'');
  const M = n => L(fmtMoney(n));
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const ML=15, MR=195, W=210; let y=18;
  const em = d.empresa || {};
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(L(em.nome||WS_META[ws].label), ML, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const meta = [em.documento, em.endereco].filter(Boolean).join(' - ');
  if(meta){ doc.text(L(meta), ML, y); y+=5; }
  doc.text('Emitido em '+L(fmtDate(todayISO())), MR, 18, {align:'right'});
  y+=2; doc.setDrawColor(150); doc.line(ML,y,MR,y); y+=8;
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Comprovante de Venda '+L(v.numero), ML, y); y+=8;
  doc.setFontSize(10);
  const linha=(rot,val)=>{ doc.setFont('helvetica','bold'); doc.text(rot, ML, y); doc.setFont('helvetica','normal'); doc.text(L(val), ML+32, y); y+=5; };
  linha('Cliente:', v.cliente); linha('Data:', fmtDate(v.data)); linha('Pagamento:', v.formaPagamento||'-');
  y+=4;
  const cab=()=>{ doc.setFillColor(235,235,235); doc.rect(ML,y-4.5,MR-ML,7,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('Material',ML+2,y); doc.text('Qtd',125,y,{align:'right'}); doc.text('Preco',156,y,{align:'right'}); doc.text('Subtotal',MR-2,y,{align:'right'}); y+=6; doc.setFont('helvetica','normal'); };
  cab();
  v.itens.forEach(it=>{
    const linhas = doc.splitTextToSize(L(it.nome), 90);
    if(y+linhas.length*4+2>275){ doc.addPage(); y=18; cab(); }
    doc.text(linhas, ML+2, y);
    doc.text(L(fmtQty(it.quantidade)+' '+(it.unidade||'')), 125, y, {align:'right'});
    doc.text(M(it.precoUnit), 156, y, {align:'right'});
    doc.text(M(it.subtotal), MR-2, y, {align:'right'});
    y += linhas.length*4+1.5;
  });
  y+=3; doc.setDrawColor(60); doc.line(ML,y-2,MR,y-2);
  const sub = v.itens.reduce((s,i)=>s+i.subtotal,0);
  if(y>250){ doc.addPage(); y=18; }
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  if(v.desconto){ doc.text('Subtotal: '+M(sub), MR, y+3, {align:'right'}); y+=5; doc.text('Desconto: -'+M(v.desconto), MR, y+3, {align:'right'}); y+=5; }
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('TOTAL: '+M(v.total), MR, y+4, {align:'right'}); y+=9;
  const saldo = saldoAbertoVenda(v);
  doc.setFontSize(10);
  if(saldo>0.005){ doc.text('Valor em aberto: '+M(saldo), MR, y+3, {align:'right'}); y+=6; }
  else { doc.setFont('helvetica','normal'); doc.text('Situacao: PAGO', MR, y+3, {align:'right'}); y+=6; }
  const qr = d.qrPagamento || {};
  if(qr.foto && saldo>0.005){
    try{
      if(y>215){ doc.addPage(); y=18; }
      y+=4;
      const fmt = /^data:image\/jpe?g/i.test(qr.foto) ? 'JPEG' : 'PNG';
      doc.addImage(qr.foto, fmt, W/2-25, y, 50, 50); y+=54;
      if(qr.legenda){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(doc.splitTextToSize(L(qr.legenda),150), W/2, y, {align:'center'}); }
    }catch(err){ console.warn('QR no PDF falhou', err); }
  }
  const nomeArq = 'venda-'+L(v.numero).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+L(v.cliente).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf';
  const blob = doc.output('blob');
  try{
    const file = new File([blob], nomeArq, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Venda '+v.numero}); return; }
  }catch(err){ if(err && err.name==='AbortError') return; }
  doc.save(nomeArq);
  showToast('PDF gerado: '+nomeArq, 'good');
}
function deleteVenda(id){

  const d = cur(); d.vendas = d.vendas.filter(x=>x.id!==id);
  saveWS(); renderAll(); showToast('Venda excluída.', 'good');
}
let vendaDraftItem = null;
function novoVendaDraftItem(){ return {produtoId:'',materialKey:'',quantidade:1,precoUnit:0,referenciaId:'',referenciaCodigo:'',descricaoRef:'',composicaoId:'',recPadraoId:''}; }
function updateVendaDraftMaterial(key){
  vendaDraftItem.materialKey = key;
  vendaDraftItem.produtoId = '';
  vendaDraftItem.precoUnit = 0;
  vendaDraftItem.composicaoId = '';
  vendaDraftItem.recPadraoId = '';
  renderVendaDraftArea();
}
function updateVendaDraftProduto(produtoId){
  const prod = cur().estoque.find(p=>p.id===produtoId);
  vendaDraftItem.produtoId = produtoId;
  vendaDraftItem.precoUnit = prod ? (isTagProntoEtq(prod) ? prod.preco/1000 : prod.preco) : 0;
  const tam = prod ? tamanhoObj(prod.tamanhoId) : null;
  vendaDraftItem.composicaoId = prod && prod.composicaoId ? prod.composicaoId : ((tam && tam.composicao && (tam.composicoes||[]).length===1) ? tam.composicoes[0].id : '');
  const emp = prod ? empresaObj(prod.empresaId) : null;
  const perfisRec = emp ? (emp.recomendacoesPadroes||[]) : [];
  vendaDraftItem.recPadraoId = prod && prod.recPadraoId ? prod.recPadraoId : (perfisRec.length===1 ? perfisRec[0].id : '');
  renderVendaDraftArea();
}
function updateVendaDraftField(field, value){
  if(field==='quantidade') vendaDraftItem.quantidade = parseFloat(value)||0;
  else if(field==='precoUnit') vendaDraftItem.precoUnit = parseFloat(value)||0;
  else if(field==='composicaoId') vendaDraftItem.composicaoId = value;
  else if(field==='recPadraoId') vendaDraftItem.recPadraoId = value;
  if(field==='quantidade' || field==='precoUnit'){
    const subEl = document.getElementById('vendaDraftSubtotal');
    if(subEl) subEl.textContent = fmtMoney((vendaDraftItem.quantidade||0)*(vendaDraftItem.precoUnit||0));
  } else {
    renderVendaDraftArea();
  }
}
function updateVendaDraftReferencia(refId){
  const ref = allReferenciasList().find(r=>r.id===refId);
  vendaDraftItem.referenciaId = refId;
  vendaDraftItem.referenciaCodigo = ref?ref.codigo:'';
  vendaDraftItem.descricaoRef = ref?ref.descricao:'';
  renderVendaDraftArea();
}
function confirmarItemVenda(){

}

  </select></div>`;

    <div class="field"><label>Preço unitário</label><input type="number" id="vendaDraftPreco" min="0" step="0.001" value="${item.precoUnit||''}" oninput="updateVendaDraftField('precoUnit',this.value)"></div>

    <div class="subtle">Subtotal deste item: <strong id="vendaDraftSubtotal">${fmtMoney((item.quantidade||0)*(item.precoUnit||0))}</strong></div>

function saveVenda(e){
  e.preventDefault();
  const itensValidos = formItens.filter(it=>it.produtoId && it.quantidade>0);
  if(!itensValidos.length){ showToast('Adicione ao menos um item válido.', 'bad'); return; }
  const problemas = checkEstoqueParaItens(itensValidos);
  if(problemas.length){ showToast(problemas.join(' · '), 'bad'); return; }
  const d = cur();
  const itens = itensValidos.map(it=>{
    const prod = d.estoque.find(p=>p.id===it.produtoId);
    let nome = tagFullLabel(prod);
    if(it.descricaoRef) nome += ' — '+it.descricaoRef;
    return { produtoId: it.produtoId, referencia: it.referenciaCodigo||'', descricaoRef: it.descricaoRef||'', codigoBarras: it.codigoBarrasRef||'', composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'', nome, unidade: saleUnitLabel(prod), quantidade: it.quantidade, precoUnit: it.precoUnit, subtotal: it.quantidade*it.precoUnit, tamanhoId: prod.tamanhoId||'', empresaId: prod.empresaId||'' };
  });
  const subtotal = itens.reduce((s,i)=>s+i.subtotal,0);
  const desconto = parseFloat(document.getElementById('f_desconto').value)||0;
  const clienteNome = document.getElementById('f_cliente').value.trim();
  const empresaMatch = (d.empresas||[]).find(emp=>emp.nome.toLowerCase()===clienteNome.toLowerCase());
  const statusPagEl = document.getElementById('f_statuspagamento');
  const totalVendaFinal = Math.max(0,subtotal-desconto);
  const statusPagInicial = statusPagEl?statusPagEl.value:'Pago';
  const venda = { id: uid(), dataRegistro: todayISO(), numero: nextNumeroDoc(), pedidoId: null, cliente: clienteNome, empresaId: empresaMatch?empresaMatch.id:'',
    data: document.getElementById('f_data').value, formaPagamento: document.getElementById('f_pagamento').value,
    desconto, itens, total: totalVendaFinal, status:'Concluída', statusPagamento: statusPagInicial,
    valorRecebido: statusPagInicial==='Pago' ? totalVendaFinal : 0, descontoPagamento: 0, entregue: true,
    criadoPor: usuarioAtual?usuarioAtual.nome:'' };
  baixarEstoqueItens(itensValidos);
  d.vendas.push(venda);
  closeModal(); saveWS(); renderAll();
  showToast('Venda registrada com sucesso.', 'good');
}

  metaLines.forEach(l=>{ t += l+'\n'; });

/* ===== Sincronização automática via Supabase ===== */
let supabaseUltimoTimestampConhecido = null;
let supabasePushDebounceTimer = null;
let supabasePollTimer = null;
let supabaseSincronizando = false;
function agendarEnvioAutomaticoSupabase(){
  if(supabasePushDebounceTimer) clearTimeout(supabasePushDebounceTimer);
  supabasePushDebounceTimer = setTimeout(()=>{ supabaseEnviarAutomatico(); }, 2500);
}
async function supabaseEnviarAutomatico(){
  const cfg = await getSupabaseConfig();
  if(!cfg.url || !cfg.anonKey || cfg.autoSync===false) return;
  if(supabaseSincronizando) return;
  supabaseSincronizando = true;
  const backup = { versao: 1, dataExportacao: new Date().toISOString(), etiquetag: DATA.etiquetag, vimats: DATA.vimats };
  const agora = new Date().toISOString();
  try{
    const resp = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/estoque_dados', {
      method: 'POST',
      headers: { 'apikey': cfg.anonKey, 'Authorization': 'Bearer '+cfg.anonKey, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id: cfg.registroId||'estoque-central', dados: backup, atualizado_em: agora })
    });
    if(resp.ok){ supabaseUltimoTimestampConhecido = agora; atualizarIndicadorSync('ok'); }
    else atualizarIndicadorSync('erro');
  } catch(e){ atualizarIndicadorSync('erro'); }
  supabaseSincronizando = false;
}
async function supabaseVerificarAtualizacoes(silencioso){
  const cfg = await getSupabaseConfig();
  if(!cfg.url || !cfg.anonKey || cfg.autoSync===false) return;
  if(supabaseSincronizando) return;
  try{
    const resp = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/estoque_dados?id=eq.'+encodeURIComponent(cfg.registroId||'estoque-central')+'&select=dados,atualizado_em', {
      headers: { 'apikey': cfg.anonKey, 'Authorization': 'Bearer '+cfg.anonKey }
    });
    if(!resp.ok) return;
    const rows = await resp.json();
    if(!rows.length) return;
    const remoto = rows[0];
    if(supabaseUltimoTimestampConhecido && new Date(remoto.atualizado_em) <= new Date(supabaseUltimoTimestampConhecido)) return;
    const parsed = remoto.dados;
    if(!parsed || !parsed.etiquetag || !parsed.vimats) return;
    supabaseSincronizando = true;
    DATA.etiquetag = migrateIfNeeded('etiquetag', parsed.etiquetag);
    DATA.vimats = migrateIfNeeded('vimats', parsed.vimats);
    await appStorage.set(WS_META.etiquetag.storageKey, JSON.stringify(DATA.etiquetag), false);
    await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    supabaseUltimoTimestampConhecido = remoto.atualizado_em;
    supabaseSincronizando = false;
    renderAll();
    atualizarIndicadorSync('ok');
    if(!silencioso) showToast('Dados atualizados automaticamente (outro dispositivo).', 'good');
  } catch(e){ supabaseSincronizando = false; atualizarIndicadorSync('erro'); }
}
function atualizarIndicadorSync(status){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  if(status==='ok'){ el.title = 'Sincronizado às '+new Date().toLocaleTimeString('pt-BR'); el.style.color = '#3AAE7A'; }
  else if(status==='erro'){ el.title = 'Falha na última sincronização'; el.style.color = '#C9A227'; }
}
async function iniciarAutoSyncSupabase(){
  const cfg = await getSupabaseConfig();
  if(supabasePollTimer){ clearInterval(supabasePollTimer); supabasePollTimer = null; }
  if(!cfg.url || !cfg.anonKey || cfg.autoSync===false) return;
  await supabaseVerificarAtualizacoes(true);
  supabasePollTimer = setInterval(()=>supabaseVerificarAtualizacoes(false), 20000);
}

async function supabaseEnviarBackup(){
  const url = document.getElementById('f_sburl').value.trim().replace(/\/$/,'');
  const anonKey = document.getElementById('f_sbkey').value.trim();
  const registroId = document.getElementById('f_sbid').value.trim() || 'estoque-central';
  const autoSync = document.getElementById('f_sbautosync') ? document.getElementById('f_sbautosync').checked : true;
  if(!url || !anonKey){ showToast('Preencha a Project URL e a anon key.', 'bad'); return; }
  await setSupabaseConfig({url, anonKey, registroId, autoSync});
  const backup = { versao: 1, dataExportacao: new Date().toISOString(), etiquetag: DATA.etiquetag, vimats: DATA.vimats };
  showToast('Enviando para o Supabase...', 'good');
  try{
    const agora = new Date().toISOString();
    const resp = await fetch(url+'/rest/v1/estoque_dados', {
      method: 'POST',
      headers: {
        'apikey': anonKey,
        'Authorization': 'Bearer '+anonKey,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ id: registroId, dados: backup, atualizado_em: agora })
    });
    if(resp.ok){
      supabaseUltimoTimestampConhecido = agora;
      await setSupabaseConfig({url, anonKey, registroId, autoSync, ultimoEnvio: agora, ultimoPuxar: (await getSupabaseConfig()).ultimoPuxar||''});
      showToast('Backup enviado para o Supabase com sucesso!', 'good');
      iniciarAutoSyncSupabase();
      openBackupModal();
    } else {
      const err = await resp.text().catch(()=>'');
      showToast('Erro ao enviar (status '+resp.status+'). Verifique se a tabela foi criada.', 'bad');
    }
  } catch(e){ showToast('Não foi possível conectar ao Supabase. Verifique sua internet e a Project URL.', 'bad'); }
}
async function supabasePuxarBackup(){
  const url = document.getElementById('f_sburl').value.trim().replace(/\/$/,'');
  const anonKey = document.getElementById('f_sbkey').value.trim();
  const registroId = document.getElementById('f_sbid').value.trim() || 'estoque-central';
  const autoSync = document.getElementById('f_sbautosync') ? document.getElementById('f_sbautosync').checked : true;
  if(!url || !anonKey){ showToast('Preencha a Project URL e a anon key.', 'bad'); return; }
  await setSupabaseConfig({url, anonKey, registroId, autoSync});
  showToast('Buscando backup no Supabase...', 'good');
  try{
    const resp = await fetch(url+'/rest/v1/estoque_dados?id=eq.'+encodeURIComponent(registroId)+'&select=dados,atualizado_em', {
      headers: { 'apikey': anonKey, 'Authorization': 'Bearer '+anonKey }
    });
    if(!resp.ok){ showToast('Erro ao buscar (status '+resp.status+').', 'bad'); return; }
    const rows = await resp.json();
    if(!rows.length){ showToast('Nenhum backup encontrado com esse ID ainda.', 'bad'); return; }
    const parsed = rows[0].dados;
    if(!parsed || !parsed.etiquetag || !parsed.vimats){ showToast('Registro encontrado, mas não é um backup válido.', 'bad'); return; }
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (Etiquetag e Vimats) pelos que estão no Supabase. Confirma?')) return;
    DATA.etiquetag = migrateIfNeeded('etiquetag', parsed.etiquetag);
    DATA.vimats = migrateIfNeeded('vimats', parsed.vimats);
    await appStorage.set(WS_META.etiquetag.storageKey, JSON.stringify(DATA.etiquetag), false);
    await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    supabaseUltimoTimestampConhecido = rows[0].atualizado_em;
    await setSupabaseConfig({url, anonKey, registroId, autoSync, ultimoPuxar: new Date().toISOString(), ultimoEnvio: (await getSupabaseConfig()).ultimoEnvio||''});
    closeModal();
    showToast('Dados atualizados a partir do Supabase!', 'good');
    renderAll();
    iniciarAutoSyncSupabase();
  } catch(e){ showToast('Não foi possível conectar ao Supabase. Verifique sua internet e a Project URL.', 'bad'); }
}
async function githubEnviarBackup(){
  const token = document.getElementById('f_ghtoken').value.trim();
  const repo = document.getElementById('f_ghrepo').value.trim();
  const path = document.getElementById('f_ghpath').value.trim() || 'backup.json';
  if(!token || !repo){ showToast('Preencha o token e o repositório.', 'bad'); return; }
  const backup = { versao: 1, dataExportacao: new Date().toISOString(), etiquetag: DATA.etiquetag, vimats: DATA.vimats };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(backup, null, 2))));
  const url = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}`;
  showToast('Enviando para o GitHub...', 'good');
  try{
    let sha = null;
    const getResp = await fetch(url, { headers: { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' } });
    if(getResp.status===200){ const getData = await getResp.json(); sha = getData.sha; }
    else if(getResp.status!==404){ showToast('Erro ao verificar o arquivo (status '+getResp.status+').', 'bad'); return; }
    const putResp = await fetch(url, {
      method:'PUT',
      headers: { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify({ message:'Backup Estoque Central - '+new Date().toLocaleString('pt-BR'), content, sha: sha||undefined })
    });
    if(putResp.ok){
      await setGithubConfig({token, repo, path, ultimoEnvio: new Date().toISOString(), ultimoPuxar: (await getGithubConfig()).ultimoPuxar||''});
      showToast('Backup enviado para o GitHub com sucesso!', 'good');
      openBackupModal();
    }
    else { const err = await putResp.json().catch(()=>({})); showToast('Erro ao enviar: '+(err.message||putResp.status), 'bad'); }
  } catch(e){ showToast('Não foi possível conectar ao GitHub. Verifique sua internet.', 'bad'); }
}

    await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    await setGithubConfig({token, repo, path, ultimoPuxar: new Date().toISOString(), ultimoEnvio: (await getGithubConfig()).ultimoEnvio||''});

function importarBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev){
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(err){ showToast('Não foi possível ler esse arquivo — verifique se é um backup válido.', 'bad'); return; }
    if(!parsed || !parsed.etiquetag || !parsed.vimats){ showToast('Arquivo de backup inválido ou incompleto.', 'bad'); return; }
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (Etiquetag e Vimats) pelos do backup. Essa ação não pode ser desfeita. Confirma?')) return;
    DATA.etiquetag = migrateIfNeeded('etiquetag', parsed.etiquetag);
    DATA.vimats = migrateIfNeeded('vimats', parsed.vimats);
    try{
      await appStorage.set(WS_META.etiquetag.storageKey, JSON.stringify(DATA.etiquetag), false);
      await appStorage.set(WS_META.vimats.storageKey, JSON.stringify(DATA.vimats), false);
    } catch(err){}
    closeModal();
    showToast('Backup restaurado com sucesso!', 'good');
    renderAll();
  };
  reader.readAsText(file);
}

function composicaoLineText(i){
  const tam = tamanhoObj(i.tamanhoId);
  if(!tam || !tam.composicao) return '';
  const emp = empresaObj(i.empresaId);
  const partes = [];
  const perfis = tam.composicoes||[];
  const perfilEscolhido = perfis.length===1 ? perfis[0] : perfis.find(p=>p.id===i.composicaoId);
  const compTxt = perfilEscolhido ? formatComposicoes(perfilEscolhido.fibras) : '';
  if(compTxt) partes.push(compTxt);
  if(emp && emp.cnpj) partes.push('CNPJ: '+emp.cnpj);
  return { texto: partes.join(' · '), recomendacoes: recomendacoesEfetivas(tam, i.empresaId, i.recPadraoId) };
}

function abrirSelecaoComprovanteResponsavel(respId){
  const d = cur();
  const resp = (d.responsaveisFinanceiros||[]).find(r=>r.id===respId);
  if(!resp) return;
  const vendasValidas = d.vendas.filter(v=>v.status!=='Cancelada');
  const empresasDoResp = (d.empresas||[]).filter(e=>e.responsavelFinanceiroId===respId);
  const itensSelecao = empresasDoResp.map(e=>{
    const vendasEmp = vendasValidas.filter(v=>v.empresaId===e.id && saldoAbertoVenda(v)>0.005);
    const pendente = vendasEmp.reduce((s,v)=>s+saldoAbertoVenda(v),0);
    return { empresaId: e.id, nome: e.nome, pendente };
  }).filter(x=>x.pendente>0);

  window._pagamentoDebitoVendaIds = vendaIds;
  openModal(`
    <div class="modal-head"><h3>Registrar pagamento${labelContexto?' · '+esc(labelContexto):''}</h3><button class="icon-btn" onclick="closeModal()">${iconX()}</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0;">Total em aberto: <strong>${fmtMoney(totalAberto)}</strong> (${vendas.length} venda(s))</p>
      <div class="field"><label>Este pagamento é</label>
        <div class="radio-row">
          <label><input type="radio" name="f_tipopagdebito" value="total" checked onchange="atualizarCampoPagamentoParcial()"> Valor total (${fmtMoney(totalAberto)})</label>
          <label><input type="radio" name="f_tipopagdebito" value="parcial" onchange="atualizarCampoPagamentoParcial()"> Pagamento parcial</label>
        </div>
      </div>
      <div class="field" id="campoValorParcial" style="display:none;"><label>Valor recebido agora (R$)</label><input type="number" min="0" step="0.01" id="f_valorrecebidodebito" placeholder="0,00">
        <p class="hint">O restante continua em aberto, como débito pendente.</p></div>
      <div class="field"><label>Houve desconto no pagamento? (opcional)</label><input type="number" min="0" step="0.01" id="f_descontodebito" placeholder="0,00">
        <p class="hint">Valor abatido do débito (ex.: desconto por pagamento à vista), somado ao valor recebido.</p></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-accent" onclick="confirmarPagamentoDebito()">${iconCheck()} Confirmar pagamento</button></div>
  `);
}
function atualizarCampoPagamentoParcial(){
  const tipo = document.querySelector('input[name="f_tipopagdebito"]:checked').value;
  const campo = document.getElementById('campoValorParcial');
  if(campo) campo.style.display = tipo==='parcial' ? 'block' : 'none';
}
function confirmarPagamentoDebito(){
  const vendaIds = window._pagamentoDebitoVendaIds||[];
  const d = cur();
  const vendasAlvo = d.vendas.filter(v=>vendaIds.includes(v.id)).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const totalAberto = vendasAlvo.reduce((s,v)=>s+saldoAbertoVenda(v),0);
  const tipo = document.querySelector('input[name="f_tipopagdebito"]:checked').value;
  const desconto = parseFloat(document.getElementById('f_descontodebito').value)||0;
  let valorRecebido = tipo==='total' ? Math.max(0, totalAberto-desconto) : (parseFloat(document.getElementById('f_valorrecebidodebito').value)||0);
  if(desconto<0 || valorRecebido<0){ showToast('Os valores não podem ser negativos.', 'bad'); return; }
  const totalAplicar = valorRecebido+desconto;
  if(totalAplicar<=0){ showToast('Informe o valor recebido e/ou o desconto.', 'bad'); return; }
  if(totalAplicar > totalAberto+0.01){ showToast('O valor informado (recebido + desconto) é maior que o débito em aberto.', 'bad'); return; }
  let restanteDesconto = desconto, restanteRecebido = valorRecebido;
  vendasAlvo.forEach(v=>{
    if(restanteDesconto<=0 && restanteRecebido<=0) return;
    const saldo = saldoAbertoVenda(v);
    if(saldo<=0.005) return;
    const descAplicado = Math.min(saldo, restanteDesconto);
    restanteDesconto -= descAplicado;
    const recAplicado = Math.min(saldo-descAplicado, restanteRecebido);
    restanteRecebido -= recAplicado;
    v.valorRecebido = (v.valorRecebido||0) + recAplicado;
    v.descontoPagamento = (v.descontoPagamento||0) + descAplicado;
    if(saldoAbertoVenda(v) <= 0.005) v.statusPagamento = 'Pago';
  });
  saveWS();
  closeModal();
  renderAll();
  const restante = totalAberto - totalAplicar;
  showToast(restante>0.005 ? 'Pagamento registrado. Restam '+fmtMoney(restante)+' em aberto.' : 'Débito quitado com sucesso.', 'good');
}

function carregarJsPDF(){
  return new Promise((res,rej)=>{
    if(window.jspdf) return res(window.jspdf);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload=()=>window.jspdf?res(window.jspdf):rej(new Error('jspdf'));
    sc.onerror=()=>rej(new Error('jspdf'));
    document.head.appendChild(sc);
  });
}

async function gerarPdfDebito(){
  const d = cur();
  const key = window._pdfDebitoKey;
  const ids = pdfDebitoIdsSelecionados();
  if(!ids.length){ showToast('Selecione ao menos uma nota.', 'bad'); return; }
  const empObj = key!=='__semempresa__' ? empresaObj(key) : null;
  const nome = empObj ? empObj.nome : 'Cliente avulso';
  const vendas = d.vendas.filter(v=>ids.includes(v.id)).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const resp = (empObj && empObj.responsavelFinanceiroId) ? (d.responsaveisFinanceiros||[]).find(r=>r.id===empObj.responsavelFinanceiroId) : null;
  let jsPDF;
  try{ jsPDF = (await carregarJsPDF()).jsPDF; }
  catch(e){
    closeModal();
    showToast('Não foi possível carregar o gerador de PDF (sem internet). Abrindo impressão: escolha "Salvar como PDF".', 'bad');
    printComprovanteDebito(key, ids); return;
  }
  const L = t => String(t==null?'':t).replace(/[   ]/g,' ').replace(/[–—]/g,'-').replace(/[^\x00-\xFF]/g,'');
  const M = n => L(fmtMoney(n));
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W=210, ML=15, MR=195; let y=18;
  const novaPag = (h)=>{ if(y+h>280){ doc.addPage(); y=18; } };
  const em = d.empresa || {};
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(L(em.nome||WS_META[ws].label), ML, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const meta = [em.documento, em.endereco].filter(Boolean).join(' - ');
  if(meta){ doc.text(L(meta), ML, y); y+=5; }
  doc.setFontSize(9); doc.text('Emitido em '+L(fmtDate(todayISO())), MR, 18, {align:'right'});
  y+=2; doc.setDrawColor(150); doc.line(ML,y,MR,y); y+=8;
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Demonstrativo de Débito', ML, y); y+=8;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text('Cliente: ', ML, y);
  doc.setFont('helvetica','normal'); doc.text(L(nome), ML+16, y); y+=5;
  if(resp){ doc.setFont('helvetica','bold'); doc.text('Responsavel financeiro: ', ML, y); doc.setFont('helvetica','normal'); doc.text(L(resp.nome+' ('+resp.codigo+')'), ML+42, y); y+=5; }
  y+=3;
  let totalGeral=0;
  vendas.forEach(v=>{
    const saldo = saldoAbertoVenda(v); totalGeral += saldo;
    const pago = v.total - saldo;
    novaPag(20+Math.min(v.itens.length,3)*6);
    doc.setFillColor(235,235,235); doc.rect(ML,y-4.5,MR-ML,7,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Venda '+L(v.numero)+'  -  '+L(fmtDate(v.data)), ML+2, y);
    doc.text('Total: '+M(v.total), MR-2, y, {align:'right'}); y+=7;
    doc.setFontSize(8.5); doc.text('Material',ML+2,y); doc.text('Qtd',120,y,{align:'right'}); doc.text('Preco',152,y,{align:'right'}); doc.text('Subtotal',MR-2,y,{align:'right'}); y+=1.5;
    doc.setDrawColor(200); doc.line(ML,y,MR,y); y+=4;
    doc.setFont('helvetica','normal');
    v.itens.forEach(it=>{
      const linhas = doc.splitTextToSize(L(it.nome), 85);
      novaPag(linhas.length*4+2);
      doc.text(linhas, ML+2, y);
      doc.text(L(fmtQty(it.quantidade)+' '+(it.unidade||'')), 120, y, {align:'right'});
      doc.text(M(it.precoUnit), 152, y, {align:'right'});
      doc.text(M(it.subtotal), MR-2, y, {align:'right'});
      y += linhas.length*4+1.5;
    });
    if(pago>0.005){
      novaPag(12); doc.setFontSize(9);
      doc.text('Ja pago: '+M(pago), MR-2, y, {align:'right'}); y+=4.5;
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text('Em aberto: '+M(saldo), MR-2, y, {align:'right'}); y+=9;
  });
  novaPag(30);
  doc.setDrawColor(60); doc.line(ML,y-3,MR,y-3);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('TOTAL DO DEBITO: '+M(totalGeral), MR, y+3, {align:'right'}); y+=14;
  const qr = d.qrPagamento || {};
  if(qr.foto){
    try{
      novaPag(62);
      const fmt = /^data:image\/jpe?g/i.test(qr.foto) ? 'JPEG' : 'PNG';
      doc.addImage(qr.foto, fmt, W/2-25, y, 50, 50); y+=54;
      if(qr.legenda){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(doc.splitTextToSize(L(qr.legenda),150), W/2, y, {align:'center'}); }
    }catch(e){ console.warn('QR no PDF falhou', e); }
  } else if(qr.legenda){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Pagamento: '+L(qr.legenda), ML, y);
  }
  const nomeArq = 'debito-'+L(nome).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+todayISO()+'.pdf';
  const blob = doc.output('blob');
  closeModal();
  try{
    const file = new File([blob], nomeArq, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Débito - '+nome});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  doc.save(nomeArq);
  showToast('PDF gerado: '+nomeArq, 'good');
}

  const grupos = chaves.map(key=>{
    const empObj = key!=='__semempresa__' ? empresaObj(key) : null;

      .sort((a,b)=>new Date(a.data)-new Date(b.data));

        <table><thead><tr><th>Código</th><th>Nome</th><th>Tamanho</th><th>Un./rolo</th><th>Em rolos</th><th>Em unidades</th><th>Custo/rolo</th><th>Valor total</th></tr></thead>
        <tbody>${lista.map(p=>{const tam=tamanhoObj(p.tamanhoId); const upr=tam?(tam.unidadesPorRolo||0):0;
          return `<tr><td>${esc(p.codigo)}</td><td>${esc(p.nome)}</td><td>${esc(tam?tam.nome:'—')}</td><td>${fmtQty(upr)}</td><td><strong>${fmtQty(p.quantidade)}</strong></td><td><strong>${fmtQty(tagEtiquetasDisponiveis(p))}</strong></td><td>${fmtMoney(p.custo)}</td><td>${fmtMoney(p.quantidade*p.custo)}</td></tr>`;
        }).join('')||'<tr><td colspan="8">Nenhum item</td></tr>'}</tbody></table>`;
        textoLinhas.push('--- '+titulo2.toUpperCase()+' ---');
        lista.forEach(p=>{ const tam=tamanhoObj(p.tamanhoId); textoLinhas.push(p.nome+': '+fmtQty(p.quantidade)+' rolos ('+fmtQty(tagEtiquetasDisponiveis(p))+' unidades, '+fmtQty(tam?tam.unidadesPorRolo||0:0)+' un./rolo)'); });
      };
      tabelaTagMp(tagMPsTag, 'Tags em Branco (matéria-prima)');
      tabelaTagMp(tagMPsComposicao, 'Etiquetas de Composição em Branco (matéria-prima)');
    }

    if(filtro==='prontos' || filtro==='todos'){
      titulo = empFiltroObj ? 'Produtos prontos · '+empFiltroObj.nome+(referenciaFiltro?' · Ref. '+referenciaFiltro:'') : (filtro==='prontos' ? 'Relatório de produtos prontos' : titulo);
      const tabelaPronto = (lista, titulo2, comComposicao)=>{
        const temReferencias = lista.some(p=>p.referencia);
        const gruposRef = {};
        lista.forEach(p=>{
          const chave = p.referencia || '__semref__';
          if(!gruposRef[chave]) gruposRef[chave] = [];
          gruposRef[chave].push(p);
        });
        const chavesRef = Object.keys(gruposRef).sort((a,b)=>{
          if(a==='__semref__') return 1;
          if(b==='__semref__') return -1;
          return a.localeCompare(b);
        });
        body += `<h3 style="font-family:'Space Grotesk';margin-bottom:6px;margin-top:20px;">${titulo2}</h3>`;
        if(!lista.length){
          body += `<table><thead><tr><th>Código</th><th>Item</th><th>Empresa</th><th>Numeração</th><th>Quantidade</th>${comComposicao?'<th>Composição têxtil</th><th>Recomendações</th>':''}<th>Preço/milheiro</th><th>Valor total</th></tr></thead><tbody><tr><td colspan="${7+(comComposicao?2:0)}">Nenhum item</td></tr></tbody></table>`;
        }
        chavesRef.forEach(chaveRef=>{
          const itensGrupo = gruposRef[chaveRef];
          if(temReferencias) body += `<div style="font-weight:700;font-size:12px;margin:12px 0 4px;">${chaveRef==='__semref__'?'Sem referência definida':'Referência: '+esc(chaveRef)}</div>`;
          body += `<table><thead><tr><th>Código</th><th>Item</th><th>Empresa</th><th>Numeração</th><th>Quantidade</th>${comComposicao?'<th>Composição têxtil</th><th>Recomendações</th>':''}<th>Preço/milheiro</th><th>Valor total</th></tr></thead>
          <tbody>${itensGrupo.map(p=>{
            const emp = empresaObj(p.empresaId); const tam = tamanhoObj(p.tamanhoId); const num = numeracaoObj(p.numeracaoId);
            let compCell = '', recCell = '';
            if(comComposicao && tam){
              const perfis = tam.composicoes||[];
              const perfilAtivo = perfis.length===1 ? perfis[0] : perfis.find(x=>x.id===p.composicaoId);
              compCell = `<td>${perfilAtivo?esc(formatComposicoes(perfilAtivo.fibras)):'—'}</td>`;
              const recs = recomendacoesEfetivas(tam, p.empresaId, p.recPadraoId);
              recCell = `<td>${recs.length?recs.map(r=>`<span title="${esc(r)}" style="margin-right:3px;">${iconCuidado(r,14)}</span>`).join(''):'—'}</td>`;
            }
            return `<tr><td>${esc(p.codigo)}</td><td>${esc(p.nome)}</td><td>${emp?esc(emp.nome):'—'}</td><td>${num?esc(num.nome):'—'}</td><td><strong>${fmtQty(p.quantidade)}</strong> un.</td>${comComposicao?compCell+recCell:''}<td>${fmtMoney(p.preco)}</td><td>${fmtMoney(itemValorEstoque(p))}</td></tr>`;
          }).join('')}</tbody></table>`;
        });
        textoLinhas.push('--- '+titulo2.toUpperCase()+' ---');
        chavesRef.forEach(chaveRef=>{
          if(temReferencias) textoLinhas.push(chaveRef==='__semref__'?'[Sem referência definida]':'[Referência: '+chaveRef+']');
          gruposRef[chaveRef].forEach(p=>{
            const emp = empresaObj(p.empresaId); const num = numeracaoObj(p.numeracaoId); const tam = tamanhoObj(p.tamanhoId);
            let linha = p.nome+' — '+(emp?emp.nome:'sem empresa')+' — '+(num?num.nome:'sem numeração')+': '+fmtQty(p.quantidade)+' un.';
            if(comComposicao && tam){
              const perfis = tam.composicoes||[];
              const perfilAtivo = perfis.length===1 ? perfis[0] : perfis.find(x=>x.id===p.composicaoId);
              if(perfilAtivo) linha += ' | Composição: '+formatComposicoes(perfilAtivo.fibras);
              textoLinhas.push(linha);
              const recs = recomendacoesEfetivas(tam, p.empresaId, p.recPadraoId);
              if(recs.length) textoLinhas.push('__ICONS__'+recs.join('|'));
            } else {
              textoLinhas.push(linha);
            }
          });
        });
      };
      tabelaPronto(tagsProntosTag, 'Tags Prontas', false);
      tabelaPronto(tagsProntosComposicao, 'Etiquetas de Composição Prontas', true);
    }
  } else {
    body += `<table><thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Tamanho</th><th>Cor</th><th>${termEmpresa()}</th><th>Qtd</th><th>Mín.</th><th>Preço</th><th>Valor total</th></tr></thead>
    <tbody>${d.estoque.map(p=>{const tam=tamanhoObj(p.tamanhoId); const emp=empresaObj(p.empresaId);return `<tr><td>${esc(p.codigo)}</td><td>${esc(p.nome)}</td><td>${esc(p.categoria)}</td><td>${esc(tam?tam.nome:'—')}</td><td>${esc(p.cor)||'—'}</td><td>${emp?esc(emp.nome):''}</td><td>${fmtQty(p.quantidade)} ${esc(p.unidade)}</td><td>${fmtQty(p.estoqueMinimo)}</td><td>${fmtMoney(p.preco)}</td><td>${fmtMoney(itemValorEstoque(p))}</td></tr>`;}).join('')||'<tr><td colspan="10">Nenhum item</td></tr>'}</tbody></table>`;
    d.estoque.forEach(p=>textoLinhas.push(p.nome+': '+fmtQty(p.quantidade)+' '+p.unidade));
  }
  const docLinesHtml = `<div class="doc-lines">${textoLinhas.map(l=>{
    if(l.startsWith('__ICONS__')){
      const recs = l.replace('__ICONS__','').split('|').filter(Boolean);
      return `<div class="line" style="align-items:center;"><span style="display:flex;gap:4px;flex-wrap:wrap;">${recs.map(r=>iconCuidado(r,14)).join('')}</span><span></span></div>`;
    }
    if(l.startsWith('---')) return `<div class="line" style="font-weight:700;margin-top:8px;"><span>${esc(l.replace(/---/g,'').trim())}</span><span></span></div>`;
    return `<div class="line"><span>${esc(l)}</span><span></span></div>`;
  }).join('')}</div>`;
  const html = `<div class="doc">${docHeadHtml(titulo+' · '+WS_META[ws].label, 'Emitido em '+fmtDate(todayISO()))}${body}${docLinesHtml}
    <div class="doc-foot"><div>Emitido em ${fmtDateTime(todayISO())}</div><div></div></div></div>`;
  const textoLinhasPlano = textoLinhas.filter(l=>!l.startsWith('__ICONS__'));
  let text = cur().empresa.nome+'\n--------------------------------\n'+titulo.toUpperCase()+'\n--------------------------------\n'+textoLinhasPlano.join('\n');
  text += '\n--------------------------------\nEmitido em '+fmtDateTime(todayISO())+'\n\n\n';
  printDocument(html, text);
}
function applyPrintPageStyle(formato){
  let sizeCSS;
  if(formato==='termica80') sizeCSS = '@page{ size: 80mm auto; margin: 3mm; }';
  else if(formato==='termica58') sizeCSS = '@page{ size: 58mm auto; margin: 2mm; }';
  else sizeCSS = '@page{ size: A4; margin: 15mm; }';
  let styleEl = document.getElementById('pageSizeStyle');
  if(!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'pageSizeStyle'; document.head.appendChild(styleEl); }
  styleEl.textContent = sizeCSS;
}
function printDocument(html, text){
  const cfg = cur().configImpressao || {formato:'a4'};
  if(cfg.metodoBluetooth==='rawbt' && text){ sendToRawBT(text); return; }
  if(cfg.metodoBluetooth==='compartilhar' && text){ shareToPrintApp(text); return; }
  applyPrintPageStyle(cfg.formato);
  const area = document.getElementById('printArea');
  area.className = cfg.formato==='termica80' ? 'thermal thermal80' : cfg.formato==='termica58' ? 'thermal thermal58' : '';
  area.innerHTML = cfg.formato && cfg.formato!=='a4' ? html.replace('class="doc"','class="doc thermal"') : html;
  const imgs = Array.from(area.querySelectorAll('img'));
  if(!imgs.length){ setTimeout(()=>window.print(), 50); return; }
  Promise.all(imgs.map(img=>{
    if(typeof img.decode === 'function'){
      return img.decode().catch(()=>new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; setTimeout(resolve,1500); }));
    }
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; setTimeout(resolve, 1500); });
  })).then(()=>{ setTimeout(()=>window.print(), 150); });
}

let usuarios = [];
let usuarioAtual = null;
async function loadUsuarios(){
  try{ const r = await appStorage.get('usuarios-config', false); const parsed = (r&&r.value)?JSON.parse(r.value):{usuarios:[]}; usuarios = parsed.usuarios||[]; }
  catch(e){ usuarios = []; }
}
async function saveUsuarios(){
  try{ await appStorage.set('usuarios-config', JSON.stringify({usuarios}), false); } catch(e){}
}
function abrirSeletorUsuario(obrigatorio){
  openModal(`
    <div class="modal-head"><h3>Quem está usando o app?</h3>${obrigatorio?'':'<button class="icon-btn" onclick="closeModal()">'+iconX()+'</button>'}</div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0;">Isso ajuda a saber quem fez cada pedido, venda ou produção. <strong>Não é uma senha de segurança</strong> — qualquer pessoa com o link ainda consegue abrir e usar o app normalmente.</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${usuarios.map(u=>`<button type="button" class="btn btn-ghost" style="justify-content:flex-start;" onclick="selecionarUsuario('${u.id}')">${esc(u.nome)}</button>`).join('') || '<p class="hint">Nenhuma pessoa cadastrada ainda.</p>'}
      </div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="abrirNovoUsuarioForm()">${iconPlus()} Adicionar pessoa</button>
    </div>
    ${obrigatorio?'':'<div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="continuarSemUsuario()">Continuar sem me identificar</button></div>'}
  `);
}
function continuarSemUsuario(){ closeModal(); }
function selecionarUsuario(id){
  usuarioAtual = usuarios.find(u=>u.id===id) || null;
  closeModal();
  renderAll();
  showToast('Olá, '+(usuarioAtual?usuarioAtual.nome:'')+'!', 'good');
}
function abrirNovoUsuarioForm(){
  openModal(`
    <div class="modal-head"><h3>Nova pessoa</h3><button class="icon-btn" onclick="abrirSeletorUsuario(false)">${iconX()}</button></div>
    <form onsubmit="salvarNovoUsuario(event)">
      <div class="modal-body">
        <div class="field"><label>Nome</label><input required id="f_usuarionome" placeholder="Ex.: Mateus"></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="abrirSeletorUsuario(false)">Voltar</button><button type="submit" class="btn btn-accent">${iconCheck()} Salvar</button></div>
    </form>`);
}
async function salvarNovoUsuario(e){
  e.preventDefault();
  const nome = document.getElementById('f_usuarionome').value.trim();
  if(!nome) return;
  const novo = {id:uid(), nome};
  usuarios.push(novo);
  await saveUsuarios();
  usuarioAtual = novo;
  closeModal();
  renderAll();
  showToast('Bem-vindo(a), '+nome+'!', 'good');
}
function excluirUsuario(id){
  if(!confirm('Excluir esta pessoa da lista?')) return;
  usuarios = usuarios.filter(u=>u.id!==id);
  if(usuarioAtual && usuarioAtual.id===id) usuarioAtual = null;
  saveUsuarios();
  renderAll();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
(async function init(){
  document.getElementById('content').innerHTML = `<div class="empty"><p>Carregando dados...</p></div>`;
  await loadAll();
  await loadUsuarios();
  document.body.className = 'ws-'+ws;
  renderAll();
  if(usuarios.length) abrirSeletorUsuario(false);
  iniciarAutoSyncSupabase();
})();
</script>
