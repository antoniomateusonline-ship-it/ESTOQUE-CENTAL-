<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estoque Central</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2C5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EFE6; --panel:#FFFFFF; --ink:#20242B; --ink-soft:#5B5F6B;
    --sidebar:#1B1F27; --sidebar-soft:#9AA0AE; --sidebar-ink:#ECE8DC;
    --accent:#E2A33D; --accent-ink:#3A2A0C;
    --good:#3F6B4F; --good-bg:#E6EFE7; --warn:#C97A2B; --warn-bg:#FBEADA; --bad:#B5482A; --bad-bg:#F7E3DB;
    --line:#DED6C2; --line-soft:#EAE4D4; --radius:10px;
  }
  body.ws-etiquetag{ --accent:#2C8C7A; --accent-ink:#0D2A24; }
  body.ws-vimats{ --accent:#E2A33D; --accent-ink:#3A2A0C; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  .ws-bar{display:flex;background:#14171D;}
  .ws-tab{flex:1;padding:14px 20px;text-align:center;background:transparent;border:none;color:#7C8293;font-family:'Space Grotesk';font-weight:700;font-size:14.5px;letter-spacing:.03em;border-bottom:3px solid transparent;transition:all .15s;}
  .ws-tab .ws-tab-sub{display:block;font-family:'Inter';font-weight:500;font-size:11px;letter-spacing:0;margin-top:2px;color:#565C6B;}
  .ws-tab.active{color:#fff;border-bottom-color:var(--accent);background:#1B1F27;}
  .ws-tab.active .ws-tab-sub{color:var(--accent);}
  .ws-tab:hover:not(.active){color:#C9CCD6;}

  #app{display:flex;min-height:calc(100vh - 54px);}

  .sidebar{width:220px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;padding:22px 14px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;border-bottom:1px solid #2B303B;margin-bottom:16px;}
  .brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:17px;height:17px;stroke:var(--accent-ink);}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;line-height:1.1;}
  .brand-sub{font-size:10.5px;color:var(--sidebar-soft);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--sidebar-soft);background:transparent;border:none;text-align:left;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;}
  .nav-item:hover{background:#252A34;color:var(--sidebar-ink);}
  .nav-item.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
  .nav-tag{margin-left:auto;font-size:10px;background:#2B303B;color:var(--sidebar-soft);padding:1px 6px;border-radius:20px;font-family:'IBM Plex Mono';}
  .nav-item.active .nav-tag{background:rgba(0,0,0,.18);color:var(--accent-ink);}
  .sidebar-footer{border-top:1px solid #2B303B;padding-top:12px;margin-top:12px;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--line);background:var(--panel);}
  .topbar h1{font-size:20px;margin:0 0 2px 0;}
  .topbar .sub{color:var(--ink-soft);font-size:12.5px;}
  .content{padding:26px 30px 60px 30px;overflow-y:auto;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;transition:filter .12s, background .12s;}
  .btn svg{width:14px;height:14px;stroke:currentColor;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{filter:brightness(1.2);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:var(--line-soft);}
  .btn-danger{background:transparent;color:var(--bad);border-color:#E4C3B4;}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:transparent;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  .kpi .value{font-family:'Space Grotesk';font-size:24px;font-weight:700;margin-top:6px;}
  .kpi .note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .kpi.alert .value{color:var(--bad);}
  .kpi.good .value{color:var(--good);}
  .kpi-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
  .kpi-icon{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;background:color-mix(in srgb, var(--accent) 16%, white);display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:17px;height:17px;stroke:var(--accent-ink);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);}
  .panel-head h3{margin:0;font-size:15px;}
  .panel-head p{margin:2px 0 0 0;font-size:12px;color:var(--ink-soft);}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .l-name{font-weight:600;}
  .list-row .l-sub{font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-top:1px;}
  .list-row .l-val{text-align:right;font-family:'IBM Plex Mono';}
  .list-row .l-val .l-parens{color:var(--ink-soft);font-size:11.5px;margin-left:4px;}

  .finance-panel{background:var(--sidebar);color:var(--sidebar-ink);border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;}
  .finance-panel h3{margin:0 0 16px 0;font-size:16px;color:#fff;}
  .finance-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #2B303B;}
  .finance-row:first-of-type{border-top:none;}
  .finance-icon{width:38px;height:38px;border-radius:9px;background:#252A34;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .finance-icon svg{width:18px;height:18px;stroke:var(--sidebar-soft);}
  .finance-label{font-size:12px;color:var(--sidebar-soft);}
  .finance-value{font-family:'Space Grotesk';font-size:21px;font-weight:700;color:#fff;margin-top:2px;}
  .finance-value.good{color:#7FE0A8;}
  .finance-note{font-size:11px;color:var(--sidebar-soft);margin-top:2px;}

  .alert-panel{background:var(--warn-bg);border:1px solid #EBCBA0;border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;}
  .alert-panel h3{display:flex;align-items:center;gap:8px;margin:0 0 10px 0;font-size:15px;color:var(--warn);}
  .alert-panel h3 svg{width:18px;height:18px;stroke:var(--warn);}
  .alert-row{display:flex;justify-content:space-between;font-size:13px;color:#7A4A1E;padding:6px 0;border-top:1px solid #EBCBA0;}
  .alert-row:first-of-type{border-top:none;}

  table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;touch-action:pan-x;max-width:100%;}
  table thead, table tbody{display:table;width:100%;table-layout:auto;}
  .doc table{display:table;overflow-x:visible;white-space:normal;max-width:none;}
  .doc table thead{display:table-header-group;}
  .doc table tbody{display:table-row-group;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--line);background:#FAF8F2;font-weight:600;}
  td{padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F4;}
  .code-tag{font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;background:var(--sidebar);color:var(--accent);padding:3px 7px;border-radius:5px;letter-spacing:.02em;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .subtle{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .gauge-wrap{display:flex;align-items:center;gap:8px;min-width:120px;}
  .gauge{width:64px;height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;flex-shrink:0;}
  .gauge > div{height:100%;border-radius:4px;}
  .qty-num{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge-good{background:var(--good-bg);color:var(--good);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-bad{background:var(--bad-bg);color:var(--bad);}
  .badge-neutral{background:var(--line-soft);color:var(--ink-soft);}
  .tipo-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--line-soft);color:var(--ink);}
  .num-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--sidebar);color:var(--accent);font-family:'IBM Plex Mono';}
  .cat-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:#EAE1F5;color:#5B3B8C;}

  .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px;}
  .stock-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stock-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .stock-card-title{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;}
  .stock-card-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .stat-grid{display:grid;gap:8px;margin-bottom:10px;}
  .stat-grid.cols2{grid-template-columns:1fr 1fr;}
  .stat-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
  .stat-box{background:#FAF8F2;border-radius:8px;padding:10px 8px;text-align:center;}
  .stat-box.accent{background:color-mix(in srgb, var(--accent) 14%, white);}
  .stat-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .stat-value{font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-top:2px;color:var(--ink);}
  .stat-box.accent .stat-value{color:var(--accent-ink);}
  .stat-unit{font-size:10.5px;color:var(--ink-soft);}
  .stock-card-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding-top:8px;border-top:1px solid var(--line-soft);}
  .stock-card-row .good{color:var(--good);font-weight:700;}
  .stock-card-cap{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .cap-title{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .cap-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;}
  .valor-box{background:var(--good-bg);color:var(--good);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;margin-top:10px;}
  .stock-group-title{font-family:'Space Grotesk';font-size:16px;font-weight:700;margin:22px 0 12px 0;display:flex;align-items:center;gap:8px;}
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
  .catalog-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .catalog-photo{width:100%;aspect-ratio:1/1;background:var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);overflow:hidden;}
  .catalog-photo img{width:100%;height:100%;object-fit:cover;}
  .catalog-body{padding:12px 14px;}
  .catalog-name{font-family:'Space Grotesk';font-weight:700;font-size:14px;}
  .catalog-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .catalog-price{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin-top:8px;color:var(--accent-ink);}

  .empty{padding:56px 20px;text-align:center;color:var(--ink-soft);}
  .empty .glyph{font-size:30px;margin-bottom:10px;opacity:.5;}
  .empty h4{margin:0 0 4px 0;color:var(--ink);font-family:'Space Grotesk';font-size:16px;}
  .empty p{margin:0 0 16px 0;font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(27,31,39,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--panel);border-radius:12px;width:100%;max-width:580px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#FDFCFA;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .field input[readonly]{background:#F1EEE6;color:var(--ink-soft);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .radio-row{display:flex;gap:14px;flex-wrap:wrap;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);}
  .preview-box{background:#FAF8F2;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12.5px;line-height:1.7;}
  .preview-box strong{font-family:'IBM Plex Mono';}
  .inline-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:4px;}

  .item-row{display:grid;grid-template-columns:1fr 80px 100px 100px 30px;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row select,.item-row input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;}
  .item-total{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;text-align:right;}
  .items-head{display:grid;grid-template-columns:1fr 80px 100px 100px 30px;gap:8px;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;}
  .item-row-etq{display:grid;grid-template-columns:1fr 110px 70px 90px 90px 30px;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row-etq select,.item-row-etq input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;}
  .items-head-etq{display:grid;grid-template-columns:1fr 110px 70px 90px 90px 30px;gap:8px;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;}
  .total-line{display:flex;justify-content:space-between;padding-top:12px;margin-top:8px;border-top:1px dashed var(--line);font-family:'Space Grotesk';font-weight:700;font-size:16px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;max-width:82vw;}
  .toast.hidden{display:none;}
  .toast.bad{background:var(--bad);}
  .toast.good{background:var(--good);}

  #printArea{position:absolute;left:-9999px;top:0;width:760px;}
  .doc{padding:10px;font-family:'IBM Plex Mono',monospace;color:#111;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px;}
  .doc-head .company{font-family:'Space Grotesk';font-size:19px;font-weight:700;}
  .doc-head .company-meta{font-size:11px;color:#444;margin-top:2px;}
  .doc-title{text-align:right;}
  .doc-title .type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444;}
  .doc-title .num{font-size:20px;font-weight:700;font-family:'Space Grotesk';}
  .doc-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:16px;color:#222;}
  .doc table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .doc th{border-bottom:1px solid #111;text-align:left;padding:6px 4px;font-size:10.5px;text-transform:uppercase;}
  .doc td{border-bottom:1px dashed #ccc;padding:7px 4px;font-size:12px;}
  .doc .doc-total{display:flex;justify-content:flex-end;gap:30px;font-size:13px;padding-top:6px;}
  .doc .doc-total .grand{font-size:17px;font-weight:700;font-family:'Space Grotesk';}
  .doc-foot{margin-top:34px;display:flex;justify-content:space-between;font-size:11px;color:#555;}
  .sign-line{margin-top:46px;border-top:1px solid #111;width:230px;padding-top:5px;font-size:10.5px;text-align:center;}
  .doc-lines{display:none;}
  .doc.thermal table{display:none;}
  .doc.thermal .doc-lines{display:block;border-top:1px dashed #999;padding-top:6px;margin-bottom:10px;}
  .doc.thermal .doc-lines .line{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;}
  .doc.thermal{font-size:11px;}
  .doc.thermal .doc-head{flex-direction:column;align-items:center;text-align:center;gap:2px;border-bottom:1px dashed #111;}
  .doc.thermal .doc-title{text-align:center;margin-top:4px;}
  .doc.thermal .doc-meta{flex-direction:column;gap:2px;font-size:11px;}
  .doc.thermal .doc-total{flex-direction:column;gap:2px;align-items:flex-end;}
  .doc.thermal .sign-line{width:85%;margin:26px auto 0;}
  #printArea.thermal80{width:80mm;}
  #printArea.thermal58{width:58mm;}
  @media print{
    body *{visibility:hidden;}
    #printArea,#printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:auto;}
  }

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:thin;}
    .brand{border-bottom:none;padding:0 10px 0 0;margin:0;border-right:1px solid #2B303B;margin-right:10px;flex-shrink:0;}
    .nav{flex-direction:row;flex:none;flex-shrink:0;}
    .nav-item{white-space:nowrap;flex-shrink:0;}

<script>
/* ============================ WORKSPACES ============================ */
const WS_META = {
  etiquetag: { key:'etiquetag', label:'ETIQUETAG', sub:'Etiquetas & Ribbons', storageKey:'estoque-etiquetag-v5', tamanhoNav:'Cadastros' },
  vimats: { key:'vimats', label:'VIMATS', sub:'Confecção & Vestuário', storageKey:'estoque-vimats-v5', tamanhoNav:'Cadastros' }
};
let ws = 'etiquetag';
let estoqueFiltro = 'todos';
function emptyData(){
  return { empresa:{nome:'Minha Empresa',documento:'',endereco:''}, estoque:[], pedidos:[], vendas:[], tamanhos:[], numeracoes:[], empresas:[], producoes:[], ribbonDescricoes:[], compras:[], outrosTipos:[], responsaveisFinanceiros:[],
    qrPagamento:{foto:'', legenda:''},
    configImpressao:{formato:'a4', assinatura:true, documento:true}, seq:{pd:1,vd:1,rb:1,tm:1,tg:1,it:1} };
}
let DATA = { etiquetag: emptyData(), vimats: emptyData() };
const appStorage = (window.storage && typeof window.storage.get==='function') ? window.storage : {
  async get(key){ try{ const v = localStorage.getItem(key); return v!==null ? {key, value:v} : null; } catch(e){ return null; } },
  async set(key, value){ try{ localStorage.setItem(key, value); return {key, value}; } catch(e){ return null; } },
  async delete(key){ try{ localStorage.removeItem(key); return {key, deleted:true}; } catch(e){ return null; } },
};
function cur(){ return DATA[ws]; }

let section = 'dashboard';
let formItens = [];
let formContext = 'venda';
let editingId = null;

/* ============================ MIGRAÇÃO / STORAGE ============================ */
function migrateIfNeeded(wsKey, raw){
  if(!raw.configImpressao) raw.configImpressao = {formato:'a4', assinatura:true, documento:true};
  if(!raw.numeracoes) raw.numeracoes = [];
  if(!raw.empresas) raw.empresas = [];
  if(!raw.producoes) raw.producoes = [];
  if(!raw.ribbonDescricoes) raw.ribbonDescricoes = [];
  if(!raw.compras) raw.compras = [];
  if(!raw.outrosTipos) raw.outrosTipos = [];
  if(!raw.qrPagamento) raw.qrPagamento = {foto:'', legenda:''};
  if(!raw.responsaveisFinanceiros) raw.responsaveisFinanceiros = [];
  raw.empresas.forEach(e=>{ if(e.responsavelFinanceiroId===undefined) e.responsavelFinanceiroId = ''; });
  if(!raw.estoque) raw.estoque = [];
  raw.empresas.forEach(e=>{
    if(!e.referencias) e.referencias = []; e.referencias.forEach(r=>{ if(!r.id) r.id = uid(); });
    if(e.cnpj===undefined) e.cnpj = '';
    if(!e.recomendacoesPadroes){
      e.recomendacoesPadroes = (e.usaRecomendacoesPadrao && (e.recomendacoesPadrao||[]).length) ? [{id:uid(), nome:'Padrão', recomendacoes:e.recomendacoesPadrao}] : [];
    }
    delete e.usaRecomendacoesPadrao; delete e.recomendacoesPadrao;
    if(!e.composicoesPadroes) e.composicoesPadroes = [];
  });
  if(!raw.vendas) raw.vendas = [];
  raw.vendas.forEach(v=>{
    if(!v.statusPagamento) v.statusPagamento = 'Pago';
    if(v.valorRecebido===undefined) v.valorRecebido = v.statusPagamento==='Pago' ? v.total : 0;
    if(v.descontoPagamento===undefined) v.descontoPagamento = 0;
    if(v.entregue===undefined) v.entregue = true;
    if(v.empresaId===undefined){
      const found = raw.empresas.find(e=>e.nome.toLowerCase()===(v.cliente||'').toLowerCase());
      v.empresaId = found ? found.id : '';
    }
  });
  if(raw.estoque.length===0){
    if(Array.isArray(raw.materiais)){
      raw.materiais.forEach(m=>{
        raw.estoque.push({ id:m.id, codigo:m.codigo, nome:m.nome, tipo: wsKey==='etiquetag'?'Ribbon':'', tipoRibbon:m.tipo||'',
          tamanhoId:'', ribbonId:'', numeracaoId:'', categoria:m.categoria||'', empresaId:'', fornecedor:m.fornecedor||'', quantidade:m.quantidade||0,
          unidade:m.unidade||'', estoqueMinimo:m.estoqueMinimo||0, custo:0, margem:0, preco:m.precoUnitario||0, vendavel: wsKey!=='etiquetag' });
      });
    }
    if(Array.isArray(raw.produtos)){
      raw.produtos.forEach(p=>{
        raw.estoque.push({ id:p.id, codigo:p.codigo, nome:p.nome, tipo: wsKey==='etiquetag'?'Tag':'', tipoRibbon:'',
          tamanhoId:p.tamanhoId||'', ribbonId:'', numeracaoId:'', categoria:p.categoria||'', empresaId:'', empresaNomeLegado:p.empresa||'', fornecedor:'', quantidade:p.quantidade||0,
          unidade:p.unidade||'', estoqueMinimo:p.estoqueMinimo||0, custo:p.custo||0, margem:0, preco:p.precoVenda||0, vendavel:true });
      });
    }
  }
  delete raw.materiais; delete raw.produtos;
  const empresaNomes = new Set();
  raw.estoque.forEach(it=>{ const nomeAntigo = it.empresa || it.empresaNomeLegado; if(nomeAntigo) empresaNomes.add(nomeAntigo); });
  empresaNomes.forEach(nome=>{ if(!raw.empresas.some(e=>e.nome===nome)) raw.empresas.push({id:uid(), nome}); });
  raw.estoque.forEach(it=>{
    const nomeAntigo = it.empresa || it.empresaNomeLegado;
    if(nomeAntigo && !it.empresaId){ const found = raw.empresas.find(e=>e.nome===nomeAntigo); if(found) it.empresaId = found.id; }
    delete it.empresa; delete it.empresaNomeLegado;
    if(it.numeracaoId===undefined) it.numeracaoId = '';
    if(it.margem===undefined) it.margem = 0;
    if(it.empresaId===undefined) it.empresaId = '';
    if(it.categoriaTag===undefined) it.categoriaTag = 'Tag';
    if(it.cor===undefined) it.cor = '';
    if(it.composicaoId===undefined) it.composicaoId = '';
    if(it.recPadraoId===undefined) it.recPadraoId = '';
    if(it.referenciaId===undefined) it.referenciaId = '';
    if(it.outroTipo===undefined) it.outroTipo = '';
    if(!it.historicoPrecos) it.historicoPrecos = [];
    if(it.outroPronto===undefined) it.outroPronto = false;
    if(it.metrosPorRolo===undefined) it.metrosPorRolo = it.tipo==='Ribbon' ? 300 : 0;
  });
  if(wsKey==='etiquetag' && !raw._migradoParaUnidades){
    raw.estoque.forEach(it=>{
      if(it.tipo==='Tag'){
        const tam = raw.tamanhos.find(t=>t.id===it.tamanhoId);
        const upr = tam ? (tam.unidadesPorRolo||0) : 0;
        if(upr>0){ it.quantidade = it.quantidade*upr; }
        it.unidade = 'un';
      }
    });
    raw._migradoParaUnidades = true;
  }
  if(Array.isArray(raw.tamanhos)){
    raw.tamanhos.forEach(t=>{
      if(t.consumoMetros>0 && !t.etiquetasPorMetroManual && !t.passoMm){ t.etiquetasPorMetroManual = 1/t.consumoMetros; }
      if(t.passoMm===undefined) t.passoMm = 0;
      if(t.etiquetasPorMetroManual===undefined) t.etiquetasPorMetroManual = 0;
      if(t.composicao===undefined) t.composicao = /composição/i.test(t.nome||'');
      if(!t.composicoes){
        const fibrasAntigas = t.composicaoTexto ? t.composicaoTexto.split(',').map(part=>{
          part = part.trim();
          const m = part.match(/^([\d.,]+%?)\s*(.*)$/);
          return (m && m[2]) ? {percentual:m[1], fibra:m[2]} : {percentual:'', fibra:part};
        }).filter(c=>c.fibra) : [];
        t.composicoes = fibrasAntigas.length ? [{id:uid(), fibras:fibrasAntigas}] : [];
      } else if(t.composicoes.length && t.composicoes[0] && t.composicoes[0].fibras===undefined && t.composicoes[0].fibra!==undefined){
        // formato antigo: lista plana de fibras vira um único perfil
        t.composicoes = [{id:uid(), fibras: t.composicoes}];
      }
      t.composicoes.forEach(p=>{ if(!p.id) p.id = uid(); if(!p.fibras) p.fibras = []; });
      delete t.composicaoTexto;
      if(!t.recomendacoes) t.recomendacoes = [];
      if(!t.precosPorRibbon) t.precosPorRibbon = t.composicao ? {Cera:t.precoMilheiro||0, 'Têxtil':t.precoMilheiro||0, Misto:t.precoMilheiro||0} : {Cera:0,'Têxtil':0,Misto:0};
    });
  }
  if(!raw.seq.tm) raw.seq.tm = 1;
  return raw;
}
async function loadAll(){
  for(const k of Object.keys(WS_META)){
    let got = false;
    try{
      const r = await appStorage.get(WS_META[k].storageKey, false);
      if(r && r.value){ DATA[k] = migrateIfNeeded(k, Object.assign(emptyData(), JSON.parse(r.value))); got = true; }
    }catch(e){ /* nada nesta chave */ }
    if(!got){
      const legacyKeys = k==='etiquetag'
        ? ['estoque-etiquetag-v4','estoque-etiquetag-v3','estoque-etiquetag-v2','estoque-etiquetag-v1']
        : ['estoque-vimats-v4','estoque-vimats-v3','estoque-vimats-v2','estoque-vimats-v1'];
      for(const legacyKey of legacyKeys){
        try{
          const r2 = await appStorage.get(legacyKey, false);
          if(r2 && r2.value){ DATA[k] = migrateIfNeeded(k, Object.assign(emptyData(), JSON.parse(r2.value))); got = true; break; }
        }catch(e2){ /* nada nesta chave legada */ }
      }
    }
    if(!got){ DATA[k] = migrateIfNeeded(k, emptyData()); }
  }
  if(!DATA.etiquetag.tamanhos.length){
    DATA.etiquetag.tamanhos = [
      {id:uid(), nome:'TAG 35x60', unidadesPorRolo:1000, passoMm:65, etiquetasPorMetroManual:0, composicao:false, composicoes:[], recomendacoes:[]},
      {id:uid(), nome:'TAG 50x75', unidadesPorRolo:1000, passoMm:80, etiquetasPorMetroManual:0, composicao:false, composicoes:[], recomendacoes:[]},
      {id:uid(), nome:'Etiqueta de Composição 33x51', unidadesPorRolo:1500, passoMm:56, etiquetasPorMetroManual:0, composicao:true, composicoes:[], recomendacoes:[]},
      {id:uid(), nome:'Etiqueta de Composição 33x76', unidadesPorRolo:1200, passoMm:81, etiquetasPorMetroManual:0, composicao:true, composicoes:[], recomendacoes:[]},
      {id:uid(), nome:'Etiqueta de Composição 25x44', unidadesPorRolo:2000, passoMm:49, etiquetasPorMetroManual:0, composicao:true, composicoes:[], recomendacoes:[]},
    ];
  }
  if(!DATA.etiquetag.numeracoes.length){
    DATA.etiquetag.numeracoes = ['P','M','G','GG','XG','36','38','40','42','44','46','48','50','52','54','56','58'].map(n=>({id:uid(), nome:n}));
  }
  if(!DATA.etiquetag.ribbonDescricoes.length){
    DATA.etiquetag.ribbonDescricoes = ['Ribbon Preto 110mm','Ribbon Metalizado 110mm'].map(n=>({id:uid(), nome:n}));
  }
  if(!DATA.vimats.tamanhos.length){
    DATA.vimats.tamanhos = ['P','M','G','GG','XG'].map(n=>({id:uid(), nome:n}));
  }
}
async function saveWS(){
  try{ await appStorage.set(WS_META[ws].storageKey, JSON.stringify(DATA[ws]), false); }
  catch(e){ showToast('Não foi possível salvar os dados agora.', 'bad'); }
}

/* ============================ HELPERS ============================ */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtMoney3(n){ n = Number(n)||0; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:3, maximumFractionDigits:3}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR'); }
function fmtQty(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:3}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString(); }
function nextCode(prefix, key){ const n = cur().seq[key]||1; cur().seq[key] = n+1; return prefix+'-'+String(n).padStart(4,'0'); }
function itemCodeInfo(tipo){
  if(ws==='etiquetag'){ if(tipo==='TagMP') return {prefix:'TM', key:'tm'}; if(tipo==='Tag') return {prefix:'TG', key:'tg'}; return {prefix:'RB', key:'rb'}; }
  return {prefix:'PR', key:'it'};
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast'+(type?(' '+type):'');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.classList.add('hidden'); }, 3800);
}
function stockLevel(qty, min){
  if(!min || min<=0) return {pct:100, color:'var(--good)', badge:'good', text:'Normal'};
  const target = min*2;
  const pct = Math.max(4, Math.min(100, (qty/target)*100));
  if(qty<=min) return {pct, color:'var(--bad)', badge:'bad', text:'Crítico'};
  if(qty<=min*1.5) return {pct, color:'var(--warn)', badge:'warn', text:'Baixo'};
  return {pct, color:'var(--good)', badge:'good', text:'Normal'};
}
function gaugeHtml(qty, min, unidade){
  const lv = stockLevel(qty, min);
  return `<div class="gauge-wrap"><span class="qty-num">${fmtQty(qty)}<span style="color:var(--ink-soft);font-weight:400;"> ${esc(unidade||'')}</span></span>
    <div class="gauge"><div style="width:${lv.pct}%;background:${lv.color};"></div></div></div>`;
}
function badgeHtml(kind, text){ return `<span class="badge badge-${kind}">${esc(text)}</span>`; }

/* ============================ PAINÉIS MINIMIZÁVEIS ============================ */
let panelColapsado = {};
const painelExpandidoPorPadrao = new Set(['pedidos-pendentes']);
function isColapsado(key){
  const k = ws+'::'+key;
  if(panelColapsado[k]!==undefined) return panelColapsado[k];
  return !painelExpandidoPorPadrao.has(key);
}
function togglePanel(key){ const k = ws+'::'+key; panelColapsado[k] = !isColapsado(key); renderAll(); }
function chevronIcon(collapsed){ return `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke-width="2.4" style="flex-shrink:0;transition:transform .15s;transform:rotate(${collapsed?'-90deg':'0deg'});"><path d="M6 9l6 6 6-6"/></svg>`; }
function collapsiblePanel(key, titleHtml, subHtml, actionsHtml, contentHtml){
  const collapsed = isColapsado(key);
  return `<div class="panel">
    <div class="panel-head" style="cursor:pointer;" onclick="togglePanel('${key}')">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;">
        ${chevronIcon(collapsed)}
        <div style="min-width:0;"><h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${titleHtml}</h3>${subHtml?`<p>${subHtml}</p>`:''}</div>
      </div>
      ${actionsHtml?`<div onclick="event.stopPropagation()">${actionsHtml}</div>`:''}
    </div>
    ${collapsed ? '' : contentHtml}
  </div>`;
}
function tamanhoObj(id){ return cur().tamanhos.find(x=>x.id===id); }
function numeracaoObj(id){ return (cur().numeracoes||[]).find(x=>x.id===id); }
function empresaObj(id){ return (cur().empresas||[]).find(x=>x.id===id); }
function isTagProntoEtq(item){ return !!item && ws==='etiquetag' && item.tipo==='Tag'; }
function tagEtiquetasDisponiveis(item){ const tam=tamanhoObj(item.tamanhoId); return tam ? item.quantidade*(tam.unidadesPorRolo||0) : 0; }
function getEtiquetasPorMetro(tam){
  if(!tam) return 0;
  if(tam.etiquetasPorMetroManual>0) return tam.etiquetasPorMetroManual;
  if(tam.passoMm>0) return 1000/tam.passoMm;
  return 0;
}
function getConsumoMetros(tam){ const epm = getEtiquetasPorMetro(tam); return epm>0 ? 1/epm : 0; }
function passoDisplay(tam){ if(!tam) return 0; if(tam.passoMm>0) return tam.passoMm; const cm=getConsumoMetros(tam); return cm>0 ? cm*1000 : 0; }
function saldoAbertoVenda(v){ return Math.max(0, v.total - (v.valorRecebido||0) - (v.descontoPagamento||0)); }
function itemValorEstoque(it){
  if(isTagProntoEtq(it)){ return (it.quantidade/1000)*it.preco; }
  return it.quantidade*it.preco;
}
function custoUnitarioItem(it){
  if(ws==='etiquetag' && it.tipo==='Ribbon') return it.preco;
  return it.custo||0;
}
function valorInvestidoItem(it){ return it.quantidade * custoUnitarioItem(it); }
function saleUnitLabel(prod){ return prod.unidade; }
function termEmpresa(){ return ws==='etiquetag' ? 'Empresa' : 'Cliente'; }
function tagFullLabel(prod){
  if(!prod) return '';
  if(ws!=='etiquetag' || (prod.tipo!=='Tag' && prod.tipo!=='TagMP')){
    if(ws!=='etiquetag'){
      let label = prod.nome;
      const tam = tamanhoObj(prod.tamanhoId);
      if(tam) label += ' - '+tam.nome;
      if(prod.cor) label += ' · '+prod.cor;
      const emp = empresaObj(prod.empresaId);
      if(emp) label += ' ('+emp.nome+')';
      return label;
    }
    return prod.nome;
  }
  let label = prod.nome;
  const num = numeracaoObj(prod.numeracaoId);
  if(num) label += ' - '+num.nome;
  const emp = empresaObj(prod.empresaId);
  if(emp) label += ' ('+emp.nome+')';
  return label;
}
function tagIdentificacaoCompleta(prod){
  if(!prod) return '';
  if(ws!=='etiquetag'){
    const partes = [prod.nome];
    const tam = tamanhoObj(prod.tamanhoId);
    if(tam) partes.push(tam.nome);
    if(prod.cor) partes.push(prod.cor);
    const emp = empresaObj(prod.empresaId);
    if(emp) partes.push(emp.nome);
    return partes.join(' · ');
  }
  if(prod.tipo!=='Tag') return prod.nome;
  const partes = [];
  const emp = empresaObj(prod.empresaId);
  if(emp) partes.push(emp.nome);
  partes.push(prod.categoriaTag==='Composição' ? 'Etiqueta de Composição' : 'TAG');
  const tam = tamanhoObj(prod.tamanhoId);
  if(tam) partes.push(tam.nome);
  const num = numeracaoObj(prod.numeracaoId);
  if(num) partes.push('Tam. '+num.nome);
  const rb = prod.ribbonId ? cur().estoque.find(x=>x.id===prod.ribbonId) : null;
  if(rb) partes.push('Ribbon '+rb.tipoRibbon);
  return partes.join(' · ');
}

/* ============================ WORKSPACE SWITCH ============================ */
function renderWsBar(){
  document.getElementById('wsBar').innerHTML = Object.values(WS_META).map(m=>`
    <button class="ws-tab ${ws===m.key?'active':''}" onclick="switchWs('${m.key}')">${m.label}<span class="ws-tab-sub">${m.sub}</span></button>`).join('');
}
function switchWs(newWs){
  if(ws===newWs) return;
  ws = newWs; document.body.className = 'ws-'+ws; section = 'dashboard'; estoqueFiltro='todos'; financeiroEmpresaSelecionada=''; fechamentoMesSelecionado=''; buscaEstoque=''; buscaPedidos=''; buscaVendas='';

}

function renderNav(){
  const d = cur();
  document.getElementById('brandSub').textContent = WS_META[ws].label;

  const el = document.getElementById('navList');
  el.innerHTML = navItems().map(n=>{
    let count = '';
    if(n.id==='pedidos') count = d.pedidos.filter(p=>p.status==='Pendente').length;

    return `<button class="nav-item ${section===n.id?'active':''}" onclick="goTo('${n.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="${n.icon}"/></svg>${n.label} ${tag}</button>`;
  }).join('');
}

function reRenderKeepingFocus(renderFn){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==='number') ? active.selectionEnd : null;
  renderFn();
  if(id){
    const el = document.getElementById(id);
    if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } }
  }
}
function setBuscaEstoque(v){ buscaEstoque = v; reRenderKeepingFocus(renderAll); }
function setBuscaPedidos(v){ buscaPedidos = v; reRenderKeepingFocus(renderAll); }
function setBuscaVendas(v){ buscaVendas = v; reRenderKeepingFocus(renderAll); }

/* ============================ DASHBOARD ============================ */
function renderDashboard(){
  const d = cur(); const isEtq = ws==='etiquetag';
  if(!d.estoque.length && !d.pedidos.length && !d.vendas.length){
    return `<div class="panel"><div class="empty">
      <div class="glyph">◧</div><h4>Comece cadastrando o estoque de ${WS_META[ws].label}</h4>
      <p>${isEtq ? 'Cadastre ribbons e tags matéria-prima para começar.' : 'Cadastre os itens do seu estoque.'}</p>
      <button class="btn btn-accent" onclick="goTo('estoque');openEstoqueForm();">${iconPlus()} Novo item</button>
    </div></div>`;
  }
  const vendasValidas = d.vendas.filter(v=>v.status!=='Cancelada');
  const totalVendas = vendasValidas.reduce((s,v)=>s+v.total,0);
  let custoVendido = 0;
  vendasValidas.forEach(v=> v.itens.forEach(it=>{
    const prod = d.estoque.find(p=>p.id===it.produtoId);
    if(prod) custoVendido += it.quantidade * custoUnitarioItem(prod);
  }));
  const lucroObtido = totalVendas - custoVendido;
  const valorInvestidoTotal = d.estoque.reduce((s,x)=>s+valorInvestidoItem(x),0);
  const baixo = d.estoque.filter(x=>x.estoqueMinimo>0 && x.quantidade<=x.estoqueMinimo);
  const pedidosPend = d.pedidos.filter(p=>p.status==='Pendente').length;

  if(isEtq){
    const ribbons = d.estoque.filter(x=>x.tipo==='Ribbon');
    const tagMPs = d.estoque.filter(x=>x.tipo==='TagMP');
    const tagsProntos = d.estoque.filter(x=>x.tipo==='Tag');
    const totalTagsMP = tagMPs.reduce((s,x)=>s+tagEtiquetasDisponiveis(x),0);
    const totalRibbonMetros = ribbons.reduce((s,x)=>s+x.quantidade,0);
    const totalProntos = tagsProntos.reduce((s,x)=>s+x.quantidade,0);
    const valorMP = ribbons.reduce((s,x)=>s+valorInvestidoItem(x),0) + tagMPs.reduce((s,x)=>s+valorInvestidoItem(x),0);
    const valorProdutos = tagsProntos.reduce((s,x)=>s+valorInvestidoItem(x),0);

    const materiaPrimaLista = [...ribbons, ...tagMPs].sort((a,b)=>b.quantidade-a.quantidade).slice(0,8);
    const producoesRecentes = [...d.producoes].sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,8);

    return `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-icon">${iconBox()}</div><div class="label">Tags em Estoque</div><div class="value">${fmtQty(totalTagsMP)}</div><div class="note">unidades (matéria-prima)</div></div>
      <div class="kpi"><div class="kpi-icon">${iconRuler()}</div><div class="label">Ribbon em Estoque</div><div class="value">${fmtQty(totalRibbonMetros)}m</div><div class="note">metros lineares</div></div>
      <div class="kpi"><div class="kpi-icon">${iconTag2()}</div><div class="label">Produtos Prontos</div><div class="value">${fmtQty(totalProntos)}</div><div class="note">tags confeccionadas</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Matéria-Prima</h3></div>
      ${materiaPrimaLista.length ? materiaPrimaLista.map(it=>{
        const isRb = it.tipo==='Ribbon';
        const rolos = isRb ? (it.metrosPorRolo>0?it.quantidade/it.metrosPorRolo:0) : it.quantidade;
        const unidadeTxt = isRb ? fmtQty(it.quantidade)+' metros' : fmtQty(tagEtiquetasDisponiveis(it))+' unidades';
        return `<div class="list-row"><div><div class="l-name">${esc(it.nome)}</div></div><div class="l-val">${unidadeTxt}<span class="l-parens">(${fmtQty(rolos)} rolos)</span></div></div>`;
      }).join('') : `<div class="empty" style="padding:24px;"><p>Nenhuma matéria-prima cadastrada.</p></div>`}
    </div>

    ${collapsiblePanel('dash-producoes', 'Produções Recentes', '', '',
      producoesRecentes.length ? producoesRecentes.map(p=>{
        const tam = tamanhoObj(p.tamanhoId); const num = numeracaoObj(p.numeracaoId); const emp = empresaObj(p.empresaId);
        const desc = (tam?tam.nome:'')+(num?' '+num.nome:'');
        return `<div class="list-row"><div><div class="l-name">${esc(p.responsavel||'—')} — ${esc(desc)}</div><div class="l-sub">${emp?esc(emp.nome)+' · ':''}${p.referencia?'Ref. '+esc(p.referencia)+' · ':''}${fmtDate(p.data)}</div></div>
          <div class="l-val" style="display:flex;align-items:center;gap:10px;"><div>${fmtQty(p.quantidade)} un.<div class="l-sub">${p.metrosRibbon?'Ribbon: '+fmtQty(p.metrosRibbon)+'m':''}</div></div>
          <button class="icon-btn" title="Imprimir comprovante" onclick="printProducao('${p.id}')">${iconPrint()}</button></div></div>`;
      }).join('') : `<div class="empty" style="padding:24px;"><p>Nenhuma produção registrada ainda.</p></div>`)}

    ${alertHtml(baixo)}
    `;
  }

  return `
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-bar"></div><div class="label">Itens em estoque</div><div class="value">${d.estoque.length}</div><div class="note">${d.pedidos.length} pedidos · ${d.vendas.length} vendas</div></div>
    <div class="kpi"><div class="kpi-bar"></div><div class="label">Pedidos pendentes</div><div class="value">${pedidosPend}</div><div class="note">Aguardando produção/entrega</div></div>
  </div>
  ${alertHtml(baixo)}
  `;
}

  return `<div class="finance-panel">

    <div class="finance-row"><div class="finance-icon">${iconWallet()}</div><div><div class="finance-label">Investimento em Estoque</div><div class="finance-value">${fmtMoney(valorInvestidoTotal)}</div><div class="finance-note">MP: ${fmtMoney(valorMP)} · Produtos: ${fmtMoney(valorProdutos)}</div></div></div>
    <div class="finance-row"><div class="finance-icon">${iconBox()}</div><div><div class="finance-label">Valor Investido em Produtos Prontos</div><div class="finance-value">${fmtMoney(valorProdutos)}</div><div class="finance-note">Custo dos produtos já fabricados, parados no estoque</div></div></div>
    <div class="finance-row"><div class="finance-icon">${iconCart()}</div><div><div class="finance-label">Total de Vendas</div><div class="finance-value">${fmtMoney(totalVendas)}</div><div class="finance-note">${nVendas} venda(s) registrada(s)</div></div></div>
    <div class="finance-row"><div class="finance-icon">${iconDollar()}</div><div><div class="finance-label">Lucro Obtido</div><div class="finance-value good">${fmtMoney(lucroObtido)}</div><div class="finance-note">Vendas − custo dos produtos</div></div></div>
  </div>`;
}
function alertHtml(baixo){
  return baixo.length ? `<div class="alert-panel"><h3>${iconWarn()} Alerta de Estoque Baixo</h3>
    ${baixo.map(it=>{
      let txt;
      if(ws==='etiquetag' && (it.tipo==='Ribbon')){ txt = fmtQty(it.metrosPorRolo>0?it.quantidade/it.metrosPorRolo:0)+' rolos restantes'; }
      else if(ws==='etiquetag' && it.tipo==='TagMP'){ txt = fmtQty(it.quantidade)+' rolos restantes'; }
      else { txt = fmtQty(it.quantidade)+' '+esc(it.unidade)+' restantes'; }
      return `<div class="alert-row"><span>${esc(it.nome)}</span><span>${txt}</span></div>`;
    }).join('')}
  </div>` : '';
}
function statusBadge(status){
  const map = {'Pendente':'warn','Em produção':'warn','Concluído':'good','Cancelado':'bad','Concluída':'good','Cancelada':'bad'};
  return badgeHtml(map[status]||'neutral', status);
}

/* ============================ ESTOQUE (unificado) ============================ */
function renderEstoque(){
  const d = cur(); const isEtq = ws==='etiquetag';
  if(!d.estoque.length){
    return `<div class="panel"><div class="empty"><div class="glyph">◧</div><h4>Nenhum item cadastrado</h4>
      <p>${isEtq ? 'Cadastre ribbons e tags matéria-prima; produtos prontos são gerados ao produzir.' : 'Cadastre os itens do seu estoque.'}</p>
      <button class="btn btn-accent" onclick="openEstoqueForm()">${iconPlus()} Novo item</button></div></div>`;
  }
  let items = [...d.estoque];
  if(buscaEstoque.trim()){
    const q = buscaEstoque.trim().toLowerCase();
    items = items.filter(it=> (it.nome||'').toLowerCase().includes(q) || (it.codigo||'').toLowerCase().includes(q));
  }
  items.sort((a,b)=>a.nome.localeCompare(b.nome));

  if(isEtq){
    const filterBar = `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-sm ${estoqueFiltro==='todos'?'btn-accent':'btn-ghost'}" onclick="setFiltro('todos')">Todos</button>
      <button class="btn btn-sm ${estoqueFiltro==='Ribbon'?'btn-accent':'btn-ghost'}" onclick="setFiltro('Ribbon')">Ribbons</button>
      <button class="btn btn-sm ${estoqueFiltro==='TagMP'?'btn-accent':'btn-ghost'}" onclick="setFiltro('TagMP')">Tags em Branco</button>
      <button class="btn btn-sm ${estoqueFiltro==='Tag'?'btn-accent':'btn-ghost'}" onclick="setFiltro('Tag')">Produtos Prontos</button>
      <button class="btn btn-sm ${estoqueFiltro==='Outro'?'btn-accent':'btn-ghost'}" onclick="setFiltro('Outro')">Outros Materiais</button>
    </div>`;
    const ribbons = items.filter(x=>x.tipo==='Ribbon');
    const tagMPsTag = items.filter(x=>x.tipo==='TagMP' && x.categoriaTag!=='Composição');
    const tagMPsComposicao = items.filter(x=>x.tipo==='TagMP' && x.categoriaTag==='Composição');
    const tagsProntos = items.filter(x=>x.tipo==='Tag');
    const outros = items.filter(x=>x.tipo==='Outro');
    let out = filterBar;
    if(estoqueFiltro==='todos' || estoqueFiltro==='Ribbon'){
      out += `<div class="stock-group-title">📏 Ribbons (matéria-prima)</div>`;
      out += ribbons.length ? `<div class="stock-grid">${ribbons.map(ribbonCardHtml).join('')}</div>` : `<div class="panel"><div class="empty" style="padding:24px;"><p>Nenhum ribbon cadastrado.</p></div></div>`;
    }
    if(estoqueFiltro==='todos' || estoqueFiltro==='TagMP'){
      out += `<div class="stock-group-title">📦 Tags em Branco (matéria-prima)</div>`;
      out += tagMPsTag.length ? `<div class="stock-grid">${tagMPsTag.map(tagMpCardHtml).join('')}</div>` : `<div class="panel"><div class="empty" style="padding:24px;"><p>Nenhuma matéria-prima de tag cadastrada.</p></div></div>`;
      out += `<div class="stock-group-title">🧾 Etiquetas de Composição em Branco (matéria-prima)</div>`;
      out += tagMPsComposicao.length ? `<div class="stock-grid">${tagMPsComposicao.map(tagMpCardHtml).join('')}</div>` : `<div class="panel"><div class="empty" style="padding:24px;"><p>Nenhuma matéria-prima de etiqueta de composição cadastrada.</p></div></div>`;
    }
    if(estoqueFiltro==='todos' || estoqueFiltro==='Tag'){
      out += `<div class="stock-group-title">🏷️ Produtos Prontos</div>`;
      const gruposEmp = {};
      (d.empresas||[]).forEach(e=>{ gruposEmp[e.id] = { key:e.id, nome:e.nome, itens:[] }; });
      const semEmpresaItens = [];
      tagsProntos.forEach(p=>{
        if(p.empresaId && gruposEmp[p.empresaId]) gruposEmp[p.empresaId].itens.push(p);
        else semEmpresaItens.push(p);
      });
      const gruposOrdenados = Object.values(gruposEmp).sort((a,b)=>a.nome.localeCompare(b.nome));
      if(semEmpresaItens.length) gruposOrdenados.push({key:'__sem__', nome:'Sem empresa definida', itens:semEmpresaItens});
      if(gruposOrdenados.length){
        out += gruposOrdenados.map(g=>{
          const totalUn = g.itens.reduce((s,p)=>s+p.quantidade,0);
          const valorTotal = g.itens.reduce((s,p)=>s+itemValorEstoque(p),0);
          const sub = g.itens.length ? `${g.itens.length} produto(s) · ${fmtQty(totalUn)} un. · Venda potencial: ${fmtMoney(valorTotal)}` : 'Nenhum produto pronto ainda';
          const tagsG = g.itens.filter(p=>p.categoriaTag!=='Composição');
          const compG = g.itens.filter(p=>p.categoriaTag==='Composição');
          let content;
          if(!g.itens.length){
            content = `<div class="empty" style="padding:20px;"><p>Nenhum produto pronto para esta empresa ainda. Use "Produzir" numa matéria-prima.</p></div>`;

        out += `<div class="panel"><div class="empty" style="padding:24px;"><p>Nenhum produto pronto ainda. Cadastre uma empresa em Cadastros e use "Produzir" numa matéria-prima para gerar.</p></div></div>`;

        gruposOutro[chave].push(it);
      });
      const chaves = Object.keys(gruposOutro).sort((a,b)=>a.localeCompare(b));
      if(chaves.length){
        out += chaves.map(chave=>{
          const lista = gruposOutro[chave];
          const tabela = `<div class="panel"><table><thead><tr><th>Código</th><th>Nome</th><th>Pronto?</th><th>Estoque</th><th>Preço</th><th></th></tr></thead>

            <button class="icon-btn" title="Excluir" onclick="deleteEstoqueItem('${it.id}')">${iconTrash()}</button></div></td></tr>`).join('')}</tbody></table></div>`;
          return `<div style="padding:10px 4px 6px;font-size:13px;font-weight:700;font-family:'Space Grotesk';">${esc(chave)}</div>${tabela}`;
        }).join('');
      } else {
        out += `<div class="panel"><div class="empty" style="padding:24px;"><p>Nenhum outro material cadastrado ainda.</p></div></div>`;
      }
    }
    return out;
  }
  return `<div class="panel"><table>
    <thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Tamanho</th><th>Cor</th><th>${termEmpresa()}</th><th>Estoque</th><th>Mín.</th><th>Preço venda</th><th>Valor em estoque</th><th></th></tr></thead>

}

  }
  const gruposEmp = {};

function recomendacoesEfetivas(tam, empresaId, recPadraoId){
  const emp = empresaObj(empresaId);
  const perfis = emp ? (emp.recomendacoesPadroes||[]) : [];
  if(perfis.length===1) return perfis[0].recomendacoes||[];
  if(perfis.length>1){
    const escolhido = perfis.find(p=>p.id===recPadraoId);
    return escolhido ? (escolhido.recomendacoes||[]) : [];
  }
  return (tam && tam.recomendacoes) || [];
}
function formatComposicoes(composicoes){
  return (composicoes||[]).map(c=>{
    let p = (c.percentual||'').trim();
    if(p && /^[\d.,]+$/.test(p)) p += '%';
    return [p, c.fibra].filter(Boolean).join(' ');
  }).filter(Boolean).join(' · ');
}
function composicaoInfoHtml(tam, empresaId){
  if(!tam || !tam.composicao) return '';
  const emp = empresaObj(empresaId);
  const perfis = (tam.composicoes||[]).map(p=>formatComposicoes(p.fibras)).filter(Boolean);
  const linhas = [];
  if(perfis.length===1) linhas.push(perfis[0]);
  else if(perfis.length>1) linhas.push(perfis.length+' composições cadastradas');
  if(emp && emp.cnpj) linhas.push('CNPJ: '+emp.cnpj);
  const perfisRec = emp ? (emp.recomendacoesPadroes||[]) : [];
  if(perfisRec.length>1) linhas.push(perfisRec.length+' padrões de recomendação cadastrados');
  const textoHtml = linhas.length ? linhas.map(l=>esc(l)).join('<br>') : '';
  const recs = perfisRec.length>1 ? [] : recomendacoesEfetivas(tam, empresaId);
  const iconsHtml = recs.length
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;color:var(--ink-soft);">${recs.map(r=>`<span title="${esc(r)}">${iconCuidado(r,16)}</span>`).join('')}</div>`
    : '';
  if(!textoHtml && !iconsHtml) return '';
  return `<div class="subtle" style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);">${textoHtml}${iconsHtml}</div>`;
}

function prontosPorNumeracaoHtml(itens, chaveBase){
  const grupos = {};
  itens.forEach(it=>{
    const chave = it.numeracaoId || '__semnum__';
    if(!grupos[chave]) grupos[chave] = { numeracaoId: it.numeracaoId||'', itens:[] };
    grupos[chave].itens.push(it);
  });
  const chaves = Object.keys(grupos);
  if(chaves.length<=1){
    return [...itens].sort((a,b)=>a.nome.localeCompare(b.nome)).map(tagProntoListRowHtml).join('');
  }
  const chavesOrdenadas = chaves.sort((a,b)=>{
    if(a==='__semnum__') return 1;
    if(b==='__semnum__') return -1;
    const na = numeracaoObj(a); const nb = numeracaoObj(b);
    return (na?na.nome:'').localeCompare(nb?nb.nome:'');
  });
  return chavesOrdenadas.map(chave=>{
    const g = grupos[chave];
    const num = numeracaoObj(g.numeracaoId);
    const titulo = num ? 'Numeração: '+num.nome : 'Sem numeração definida';
    const key = (chaveBase||'num')+'-'+chave;
    const collapsed = isColapsado(key);
    return `<div style="display:flex;align-items:center;gap:6px;padding:6px 4px 6px 20px;font-size:10.5px;font-weight:600;color:var(--ink-soft);border-left:2px dotted var(--line);margin:2px 0 0;cursor:pointer;" onclick="togglePanel('${key}')">${chevronIcon(collapsed)} ${esc(titulo)} (${g.itens.length})</div>
      ${collapsed ? '' : [...g.itens].sort((a,b)=>a.nome.localeCompare(b.nome)).map(tagProntoListRowHtml).join('')}`;
  }).join('');

function prontosPorReferenciaHtml(itens, chaveBase){
  const grupos = {};
  itens.forEach(it=>{
    const chave = it.referencia || '__semref__';
    if(!grupos[chave]) grupos[chave] = { referencia: it.referencia||'', itens:[] };
    grupos[chave].itens.push(it);

    if(a==='__semref__') return 1;
    if(b==='__semref__') return -1;

  if(chaves.length===1 && chaves[0]==='__semref__'){

  return chaves.map(chave=>{
    const g = grupos[chave];
    const titulo = g.referencia ? 'Referência: '+g.referencia : 'Sem referência definida';

function handleFotoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecione um arquivo de imagem.', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 600;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*(maxDim/w)); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*(maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
      const hidden = document.getElementById('f_foto'); if(hidden) hidden.value = dataUrl;
      const preview = document.getElementById('fotoPreview'); if(preview) preview.src = dataUrl;
      const wrap = document.getElementById('fotoPreviewWrap'); if(wrap) wrap.style.display = 'block';
      const hint = document.getElementById('fotoHint'); if(hint) hint.textContent = 'Toque para trocar a foto.';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function handleQrPagamentoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecione um arquivo de imagem.', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 500;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*(maxDim/w)); w = maxDim; } else { w = Math.round(w*(maxDim/h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      const hidden = document.getElementById('f_qrfoto'); if(hidden) hidden.value = dataUrl;
      const preview = document.getElementById('qrPreview'); if(preview) preview.src = dataUrl;
      const wrap = document.getElementById('qrPreviewWrap'); if(wrap) wrap.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function saveEstoque(e){
  e.preventDefault();
  const isEtq = ws==='etiquetag';
  const tipoRadio = isEtq ? document.querySelector('input[name="tipoItem"]:checked').value : '';
  const tipo = isEtq ? normalizarTipoRadio(tipoRadio) : '';
  const categoriaTagValue = (tipoRadio==='ComposicaoMP' || tipoRadio==='Composicao') ? 'Composição' : 'Tag';
  const tamanhoElId = (isEtq && tipo==='Tag') ? 'f_descricaoproduto' : (isEtq && tipo==='TagMP') ? 'f_descricaomp' : 'f_tamanho';
  if(isEtq && (tipo==='TagMP'||tipo==='Tag') && !document.getElementById(tamanhoElId).value){ showToast('Selecione a descrição do produto.', 'bad'); return; }
  if(isEtq && tipo==='Outro' && !document.getElementById('f_outrotipo').value.trim()){ showToast('Informe o nome do tipo de material.', 'bad'); return; }
  const d = cur();
  const outroTipoValor = (isEtq && tipo==='Outro') ? document.getElementById('f_outrotipo').value.trim() : '';
  if(outroTipoValor){
    if(!d.outrosTipos) d.outrosTipos = [];
    if(!d.outrosTipos.includes(outroTipoValor)) d.outrosTipos.push(outroTipoValor);
  }
  const custoExistente = editingId ? ((d.estoque.find(x=>x.id===editingId)||{}).custo||0) : 0;
  const tamanhoIdSelecionado = document.getElementById(tamanhoElId) ? document.getElementById(tamanhoElId).value : '';
  let quantidadeInformada = parseFloat(document.getElementById('f_quantidade').value)||0;
  let estoqueMinimoInformado = parseFloat(document.getElementById('f_min').value)||0;
  if(isEtq && tipo==='TagMP'){
    const tamSel = tamanhoObj(tamanhoIdSelecionado);
    const uprSel = tamSel ? (tamSel.unidadesPorRolo||0) : 0;
    if(uprSel>0){ quantidadeInformada = quantidadeInformada/uprSel; estoqueMinimoInformado = estoqueMinimoInformado/uprSel; }
  }
  const data = {
    nome: document.getElementById('f_nome').value.trim(),
    tipo,
    tipoRibbon: (isEtq && tipo==='Ribbon') ? document.getElementById('f_tiporibbon').value : '',
    tamanhoId: tamanhoIdSelecionado,
    numeracaoId: (isEtq && tipo==='Tag' && document.getElementById('f_numeracao')) ? document.getElementById('f_numeracao').value : '',
    categoriaTag: categoriaTagValue,
    categoria: !isEtq ? document.getElementById('f_categoria').value.trim() : '',
    cor: (!isEtq && document.getElementById('f_cor')) ? document.getElementById('f_cor').value.trim() : '',
    empresaId: document.getElementById('f_empresa') ? document.getElementById('f_empresa').value : '',
    foto: document.getElementById('f_foto') ? document.getElementById('f_foto').value : '',
    fornecedor: document.getElementById('f_fornecedor') ? document.getElementById('f_fornecedor').value.trim() : '',
    metrosPorRolo: (isEtq && tipo==='Ribbon' && document.getElementById('f_metrosrolo')) ? (parseFloat(document.getElementById('f_metrosrolo').value)||0) : 0,
    precoRolo: (isEtq && tipo==='Ribbon' && document.getElementById('f_precorolo')) ? (parseFloat(document.getElementById('f_precorolo').value)||0) : 0,
    outroTipo: outroTipoValor,
    outroPronto: (isEtq && tipo==='Outro') ? (tipoRadio==='OutroPronto') : false,
    composicaoId: (isEtq && tipo==='Tag' && document.getElementById('f_composicaopronto')) ? document.getElementById('f_composicaopronto').value : '',
    recPadraoId: (isEtq && tipo==='Tag' && document.getElementById('f_recpadraopronto')) ? document.getElementById('f_recpadraopronto').value : '',
    ribbonId: (isEtq && tipo==='Tag' && document.getElementById('f_ribbonpronto')) ? document.getElementById('f_ribbonpronto').value : '',
    referenciaId: (isEtq && tipo==='Tag' && document.getElementById('f_referenciapronto')) ? document.getElementById('f_referenciapronto').value : '',
    referencia: (isEtq && tipo==='Tag' && document.getElementById('f_referenciapronto') && document.getElementById('f_referenciapronto').value)
      ? ((allReferenciasList().find(r=>r.id===document.getElementById('f_referenciapronto').value)||{}).codigo||'') : '',
    quantidade: quantidadeInformada,
    unidade: document.getElementById('f_unidade').value.trim()||'un',
    estoqueMinimo: estoqueMinimoInformado,
    custo: (isEtq && tipo==='Ribbon') ? (window._custoRibbonCalculado||0) : (document.getElementById('f_custo') ? (parseFloat(document.getElementById('f_custo').value)||0) : custoExistente),
    margem: 0,
    preco: (isEtq && tipo==='Ribbon') ? (window._custoRibbonCalculado||0) : (document.getElementById('f_preco') ? (parseFloat(document.getElementById('f_preco').value)||0) : 0),
    vendavel: isEtq ? (tipo==='Tag' || tipo==='Outro') : true,
  };
  if(editingId){
    const itemExistente = d.estoque.find(x=>x.id===editingId);
    if(itemExistente){
      if(!itemExistente.historicoPrecos) itemExistente.historicoPrecos = [];
      if(itemExistente.preco!==data.preco || itemExistente.custo!==data.custo){
        itemExistente.historicoPrecos.push({ data: todayISO(), custo: itemExistente.custo, preco: itemExistente.preco });
        if(itemExistente.historicoPrecos.length>30) itemExistente.historicoPrecos = itemExistente.historicoPrecos.slice(-30);
      }
      Object.assign(itemExistente, data);
    }
  }
  else { data.id = uid(); data.historicoPrecos = []; const info = itemCodeInfo(tipo); data.codigo = nextCode(info.prefix, info.key); d.estoque.push(data); }
  closeModal(); saveWS(); renderAll();
  showToast('Salvo com sucesso.', 'good');
}

function aplicarReajusteLote(e){
  e.preventDefault();
  const d = cur();
  const tipo = document.getElementById('f_reajustetipo').value;
  const pct = parseFloat(document.getElementById('f_reajustepct').value);
  const alvo = document.querySelector('input[name="f_reajustealvo"]:checked').value;
  if(isNaN(pct) || pct===0){ showToast('Informe um percentual diferente de zero.', 'bad'); return; }
  const fator = 1 + (pct/100);
  const itensAlvo = d.estoque.filter(it=> !tipo || it.tipo===tipo);
  if(!itensAlvo.length){ showToast('Nenhum item encontrado para esse filtro.', 'bad'); return; }
  if(!confirm('Isso vai reajustar '+itensAlvo.length+' item(ns) em '+pct+'%. Confirma?')) return;
  const dataHoje = todayISO();
  itensAlvo.forEach(it=>{
    if(!it.historicoPrecos) it.historicoPrecos = [];
    const precoAntigo = it.preco, custoAntigo = it.custo;
    let mudou = false;
    if(alvo==='preco' || alvo==='ambos'){ it.preco = Math.round(it.preco*fator*1000)/1000; mudou = true; }
    if(alvo==='custo' || alvo==='ambos'){ it.custo = Math.round(it.custo*fator*1000)/1000; mudou = true; }
    if(mudou){
      it.historicoPrecos.push({ data: dataHoje, custo: custoAntigo, preco: precoAntigo });
      if(it.historicoPrecos.length>30) it.historicoPrecos = it.historicoPrecos.slice(-30);
    }
  });
  closeModal(); saveWS(); renderAll();
  showToast('Reajuste aplicado em '+itensAlvo.length+' item(ns).', 'good');
}

function applyAjuste(e, id){

  if(tipo==='saida' && qtd>item.quantidade){ showToast('Quantidade de saída maior que o estoque disponível.', 'bad'); return; }

function it_categoriaLabel(it){ return it.categoriaTag==='Composição' ? 'Etiqueta de Composição' : 'Tag'; }
function saveProducao(e, tagMpId){
  e.preventDefault();
  const d = cur();
  const mp = d.estoque.find(x=>x.id===tagMpId);
  const tam = tamanhoObj(mp.tamanhoId);
  const upr = tam ? (tam.unidadesPorRolo||0) : 0;
  const consumoM = tam ? getConsumoMetros(tam) : 0;
  const itensValidos = producaoItens.filter(it=>(parseFloat(it.quantidade)||0)>0);
  if(!itensValidos.length){ showToast('Adicione ao menos um item com quantidade.', 'bad'); return; }
  const totalQuantidade = itensValidos.reduce((s,it)=>s+(parseFloat(it.quantidade)||0),0);
  const rollsNecessarios = upr>0 ? totalQuantidade/upr : totalQuantidade;
  if(rollsNecessarios > mp.quantidade){ showToast('Matéria-prima insuficiente para a quantidade total.', 'bad'); return; }
  const consumoPorRibbon = {};
  itensValidos.forEach(it=>{ if(it.ribbonId){ consumoPorRibbon[it.ribbonId] = (consumoPorRibbon[it.ribbonId]||0) + (parseFloat(it.quantidade)||0)*consumoM; } });
  for(const ribbonId in consumoPorRibbon){
    const rb = d.estoque.find(x=>x.id===ribbonId);
    if(!rb || rb.quantidade < consumoPorRibbon[ribbonId]){ showToast('Ribbon "'+(rb?rb.nome:'?')+'" insuficiente para a produção.', 'bad'); return; }
  }
  const responsavel = document.getElementById('f_responsavel').value.trim();
  mp.quantidade -= rollsNecessarios;
  const custoTagUn = upr>0 ? mp.custo/upr : 0;
  itensValidos.forEach(it=>{
    const quantidade = parseFloat(it.quantidade)||0;
    let ribbon = null, metrosRibbon = 0;
    if(it.ribbonId){ ribbon = d.estoque.find(x=>x.id===it.ribbonId); metrosRibbon = quantidade*consumoM; if(ribbon) ribbon.quantidade -= metrosRibbon; }
    const custoRibbonUn = ribbon ? ribbon.preco*consumoM : 0;
    const custoNovoUn = custoTagUn + custoRibbonUn;
    const precoMilheiro = parseFloat(it.precoMilheiro)||0;
    let pronto = d.estoque.find(x=>x.tipo==='Tag' && x.tamanhoId===mp.tamanhoId && x.categoriaTag===mp.categoriaTag && x.numeracaoId===(it.numeracaoId||'') && x.empresaId===(it.empresaId||''));
    if(pronto){
      const custoMedio = (pronto.quantidade*pronto.custo + quantidade*custoNovoUn) / (pronto.quantidade+quantidade || 1);
      pronto.quantidade += quantidade;
      pronto.custo = custoMedio;
      if(it.ribbonId) pronto.ribbonId = it.ribbonId;
      if(precoMilheiro>0) pronto.preco = precoMilheiro;
      if(it.composicaoId) pronto.composicaoId = it.composicaoId;
      if(it.recPadraoId) pronto.recPadraoId = it.recPadraoId;
    } else {
      pronto = { id: uid(), codigo: nextCode('TG','tg'), nome: mp.nome, tipo:'Tag', tipoRibbon:'',
        tamanhoId: mp.tamanhoId, categoriaTag: mp.categoriaTag, numeracaoId: it.numeracaoId||'', empresaId: it.empresaId||'', ribbonId: it.ribbonId||'', fornecedor:'', metrosPorRolo:0,
        composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'',
        quantidade, unidade:'un', estoqueMinimo:0, custo:custoNovoUn, margem:0, preco:precoMilheiro, vendavel:true };
      d.estoque.push(pronto);
    }
    const refInfo = it.referenciaId ? allReferenciasList().find(r=>r.id===it.referenciaId) : null;
    d.producoes.push({ id: uid(), data: todayISO(), responsavel, tamanhoId: mp.tamanhoId, numeracaoId: it.numeracaoId||'', empresaId: it.empresaId||'',
      quantidade, metrosRibbon, ribbonId: it.ribbonId||'', tagProntoId: pronto.id, referencia: refInfo?refInfo.codigo:'', descricaoRef: refInfo?refInfo.descricao:'', pedidoId:'',
      composicaoId: it.composicaoId||'', recPadraoId: it.recPadraoId||'' });
  });
  closeModal(); saveWS(); renderAll();
  showToast('Produção registrada! '+fmtQty(totalQuantidade)+' un. em '+itensValidos.length+' item(ns).', 'good');
}

  ];
  let composicaoRowHtml = '';

  }
  const html = `<div class="doc">${docHeadHtml('Comprovante de produção', 'PRD-'+p.data.slice(0,10))}
    <table><tbody>${linhas.map(l=>`<tr><td style="font-weight:600;">${esc(l[0])}</td><td>${esc(l[1])}</td></tr>`).join('')}${composicaoRowHtml}</tbody></table>
    <div class="doc-foot"><div>Emitido em ${fmtDateTime(todayISO())}</div>${signLineHtml()}</div></div>`;
  const linhasTexto = linhas.slice();
  if(composicaoTexto) linhasTexto.push(['Composição têxtil', composicaoTexto]);
  const text = buildReceiptText('Comprovante de produção', 'PRD-'+p.data.slice(0,10), linhasTexto.map(l=>l[0]+': '+l[1]), [], []);
  printDocument(html, text);
}

  const d = cur();

  itensValidos.forEach(it=>{

    if(!prod){ problemas.push('Item não encontrado.'); return; }
    if(prod.quantidade < it.quantidade){ problemas.push(`${tagFullLabel(prod)}: apenas ${fmtQty(prod.quantidade)} ${prod.unidade} disponíveis`); }
  });
  return problemas;
}

          <td class="mono">${fmtMoney(p.total)}</td>
          <td><div class="row-actions">
            <button class="btn btn-ghost btn-sm" title="Imprimir" onclick="printPedido('${p.id}')">${iconPrint()} Imprimir</button>
            ${(p.status==='Pendente' && ws==='etiquetag')?`<button class="btn btn-ghost btn-sm" title="Enviar para produção" onclick="enviarPedidoParaProducao('${p.id}')">${iconFactory()} Enviar p/ Produção</button>`:''}
            ${p.status==='Pendente'?`<button class="btn btn-accent btn-sm" title="Transferir para venda" onclick="convertPedido('${p.id}')">${iconCheck()} Transformar em venda</button>`:''}
            ${p.status==='Pendente'?`<button class="icon-btn" title="Cancelar pedido" onclick="cancelPedido('${p.id}')">${iconX()}</button>`:''}
            <button class="icon-btn" title="Excluir" onclick="deletePedido('${p.id}')">${iconTrash()}</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table>` : `<div class="empty" style="padding:20px;"><p>Nenhum pedido aqui.</p></div>`;
    return collapsiblePanel(g.key, g.titulo+' ('+lista.length+')', '', '', content);
  }).join('');
}
function enviarPedidoParaProducao(pedidoId){

  if(!p || !p.itens.length){ showToast('Este pedido não tem itens.', 'bad'); return; }
  const tamanhoId = p.itens[0].tamanhoId;
  if(!tamanhoId){ showToast('Não foi possível identificar o produto deste pedido.', 'bad'); return; }
  const mp = d.estoque.find(x=>x.tipo==='TagMP' && x.tamanhoId===tamanhoId);
  if(!mp){ showToast('Não há matéria-prima cadastrada para este produto. Cadastre-a no Estoque antes.', 'bad'); return; }
  openProducaoModal(mp.id);

}

function buildMaterialGroups(vendaveis){

  vendaveis.forEach(p=>{
    const key = (p.empresaId||'-')+'|'+(p.tamanhoId||'-')+'|'+(p.categoriaTag||'-');
    if(!groups[key]) groups[key] = { key, empresaId:p.empresaId, tamanhoId:p.tamanhoId, categoriaTag:p.categoriaTag, itens: [] };
    groups[key].itens.push(p);
  });
  return Object.values(groups);
}

function updateItem(idx, field, value){
  const d = cur();
  if(field==='produtoId'){
    const prod = d.estoque.find(p=>p.id===value);
    formItens[idx].produtoId = value;
    formItens[idx].precoUnit = prod ? (isTagProntoEtq(prod) ? prod.preco/1000 : prod.preco) : 0;
    const tam = prod ? tamanhoObj(prod.tamanhoId) : null;
    formItens[idx].composicaoId = prod && prod.composicaoId ? prod.composicaoId : ((tam && tam.composicao && (tam.composicoes||[]).length===1) ? tam.composicoes[0].id : '');
    const emp = prod ? empresaObj(prod.empresaId) : null;
    const perfisRec = emp ? (emp.recomendacoesPadroes||[]) : [];
    formItens[idx].recPadraoId = prod && prod.recPadraoId ? prod.recPadraoId : (perfisRec.length===1 ? perfisRec[0].id : '');
  } else if(field==='numeracaoId'){ formItens[idx].numeracaoId = value; }
  else if(field==='quantidade'){ formItens[idx].quantidade = parseFloat(value)||0; }
  else if(field==='precoUnit'){ formItens[idx].precoUnit = parseFloat(value)||0; }
  else if(field==='composicaoId'){ formItens[idx].composicaoId = value; }
  else if(field==='recPadraoId'){ formItens[idx].recPadraoId = value; }
  else if(field==='empresaId'){
    formItens[idx].empresaId = value;
    formItens[idx].recPadraoId = '';
    const emp = empresaObj(value);
    const perfisRec = emp ? (emp.recomendacoesPadroes||[]) : [];
    if(perfisRec.length===1) formItens[idx].recPadraoId = perfisRec[0].id;
  } else if(field==='ribbonId'){
    formItens[idx].ribbonId = value;
    const tam = tamanhoObj(formItens[idx].tamanhoId);
    if(tam && tam.composicao){
      const ribbon = value ? d.estoque.find(x=>x.id===value) : null;
      const tipo = ribbon ? ribbon.tipoRibbon : '';
      formItens[idx].precoUnit = (tam.precosPorRibbon && tipo) ? (tam.precosPorRibbon[tipo]||0)/1000 : 0;
    }
  }
  renderItensBody();
}
